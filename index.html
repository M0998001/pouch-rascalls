// ---- story scenes ----
async function marinaScene(api){
  if(flag('badge2')){await say('Captain Marina: Fair winds, sailor! Sparkton\'s north past Gale Bluffs. Mind the Grumble Crew.');return;}
  if(!flag('badge1')){await say('Captain Marina: Come back when you\'ve earned your first badge, sailor.');return;}
  await say('Captain Marina: Ahoy! I\'m Marina, captain of the Saltreach fleet and Warden of the Tide Badge.');
  await say('Captain Marina: The sea is gentle and fierce all at once. Let\'s see if you can ride the waves!');
  if(await ask('Captain Marina: Ready to battle?',['Anchors aweigh!','Not yet'])!==0)return;
  const won=await api.battle({name:'Captain Marina',look:LOOKS.marina,team:[['bubblub',16],['krabastion',17],['brookfin',19]],prize:2000,lose:'Captain Marina: Ha! You sailed right through my fleet!',warden:true});
  if(!won)return;
  G.player.badges.push('Tide');G.flags.badge2=1;
  await say('You received the Tide Badge!');
  const c=await ask('Captain Marina: A true sailor knows what matters most. What\'s your compass point?',['My friends and rascals','Victory, always']);
  addRep(c===0?'heart':'grit',2);
  await say('Captain Marina: Then take this hat. Every captain needs one.');giveGear('captainhat');await say('You received the Captain\'s Hat (gear)!');
  api.give('candy',3);await say('You also received 3 Honey Drops!');
  await say('Captain Marina: Now, I hear Sparkton\'s gone dark. North through Gale Bluffs, sailor. Go see what\'s going on!');
  gainTamerXp(120);saveGame();
}
async function lighthouseKip(api){
  const q=G.quests.lighthouse;
  if(q==='done'){await say('Old Kip: The lighthouse shines bright again, thanks to you and your glowing friend.');return;}
  const glim=G.party.find(m=>SPECIES[m.sp].types.includes('Glimmer'));
  if(q==='active'&&glim){await say(`Old Kip: Oh my... ${monName(glim)}'s glow is perfect! Let me borrow that light for a moment...`);await say('The lighthouse flickers back to life across the harbor!');
    addRep('heart',2);G.bag.plushpouch=(G.bag.plushpouch||0)+5;G.bag.goldberry=(G.bag.goldberry||0)+2;await say('Old Kip: Take these, from my seafaring days. Thank you, truly.');await say('You got 5 Plush Pouches and 2 Golden Berries!');questDone('lighthouse');return;}
  if(q==='active'){await say('Old Kip: A Glimmer rascal\'s light could relight my lighthouse. Glowbugs live in Whisperwood, and Bubblubs evolve into glowing Jellumi!');return;}
  await say('Old Kip: The old lighthouse lamp burned out, and the ships are having trouble at night...');
  if(await ask('Help Old Kip?',['I\'ll find a light!','Sorry']) ===0){questStart('lighthouse');addRep('heart',1);await say('Old Kip: Glimmer rascals glow brighter than any lamp. Bring one by!');}
}
async function voltScene(api){
  if(!flag('hideoutCleared')){
    await say('Warden Volt: Who\'s there? Oh — a tamer! Sorry, it\'s pitch black in here.');
    await say('Warden Volt: The Grumble Crew snuck in and stole our Spark Cells! Without them the whole town\'s dark. I can\'t hold badge battles like this.');
    await say('Warden Volt: They fled to Cinder Hollow, east of Gale Bluffs. Please... bring our power back!');
    questStart('spark_cells');return;}
  if(G.bag.sparkcells){G.bag.sparkcells=0;await say('Warden Volt: The Spark Cells! You got them back!');await say('*CLUNK* ... *whirrrrr* ... The lights of Sparkton flicker on!');questDone('spark_cells');addRep('heart',1);G.player.money+=1000;await say('Warden Volt: The town owes you. Here\'s 1000 coins — and of course, a badge battle!');}
  if(flag('badge3')){await say('Warden Volt: Keep that spark alive! The northern pass is open now. Head north to Glacia Village!');return;}
  await say('Warden Volt: I\'m Volt, Warden of the Spark Badge. My rascals hit hard and fast. Blink and you\'ll miss it!');
  if(await ask('Warden Volt: Ready?',['Let\'s go!','Give me a minute']) !==0)return;
  const won=await api.battle({name:'Warden Volt',look:LOOKS.volt,team:[['thundermunk',23],['voltbeetle',24],['tempestork',26]],prize:2800,lose:'Warden Volt: Shocking! Truly shocking!',warden:true});
  if(!won)return;
  G.player.badges.push('Spark');G.flags.badge3=1;
  await say('You received the Spark Badge!');
  const c=await ask('Warden Volt: You battle like a thunderstorm! Or... are you more of a warm sunbeam?',['A warm sunbeam','A thunderstorm!']);addRep(c===0?'heart':'grit',2);
  api.give('candy',4);await say('Warden Volt: Take these Honey Drops! Fuel for your team.');
  gainTamerXp(150);saveGame();
  await say('🎉 You finished Chapter 2! Three badges down. The mountain pass north of Sparkton is now open — the snowy north awaits!');
}
async function bossScene(api){
  if(flag('hideoutCleared'))return;
  await say('Big Grumble: WHO DARES ENTER THE GRUMBLE CREW\'S SECRET HIDEOUT?!');
  await say('Big Grumble: Oh. It\'s just a kid. ...The kid who keeps beating my crew, apparently.');
  const c=await ask('How do you respond?',['Give back Sparkton\'s Spark Cells!','Why are you doing all this?']);
  if(c===0){addRep('grit',1);await say('Big Grumble: Hah! Make me!');}
  else{addRep('heart',1);await say('Big Grumble: Why? WHY?! Because... because this cave is DARK, okay?! And very spooky!');}
  const won=await api.battle({name:'Big Grumble',look:LOOKS.boss,team:[['banditail',21],['gloomwraith',22],['magmaul',23]],prize:1500,lose:'Big Grumble: Nooo! My beautiful, glowy plan!',noBlackout:false});
  if(!won)return;
  await say('Big Grumble: Fine... FINE. Here are your silly Spark Cells.');
  G.bag.sparkcells=1;await say('You got the Spark Cells!');
  await say('Big Grumble: *sniff* It\'s just... the Crew lives down here, and it\'s so dark, and the bats are scary, and...');
  const d=await ask('Big Grumble looks miserable.',['Glowbugs love company. Ask them to visit, instead of stealing.','The Grumble Crew is done. Disband, now!']);
  if(d===0){addRep('heart',3);G.flags.crewFriendly=1;
    await say('Big Grumble: ...Ask? Just... ask? Nobody ever told me that!');
    await say('Big Grumble: From now on we\'re the GLOW Crew! Here — take this. Least I can do.');giveGear('lantern');await say('You got the Glow Lantern (gear)!');}
  else{addRep('grit',3);await say('Big Grumble: Okay, okay! We\'ll disband! ...Here, take the Crew\'s savings. All of it.');G.player.money+=3000;G.bag.goldberry=(G.bag.goldberry||0)+3;await say('You received 3000 coins and 3 Golden Berries!');}
  G.flags.hideoutCleared=1;gainTamerXp(150);
  await say('Take the Spark Cells back to Warden Volt in Sparkton!');
  saveGame();
}

const _ci={};function CI(h){let v=_ci[h];if(v!==undefined)return v;const [r,g,b]=hexToRgb(h);return _ci[h]=((255<<24)|(b<<16)|(g<<8)|r)>>>0;}

const ROOFS='RQPV',WALLS='HOD',ROOF_COL={R:'#c8553d',Q:'#4a7fc1',P:'#e98aa8',V:'#5a9a4a'};

function edgeDist(lx,ly,o){const X=lx+.5,Y=ly+.5;let d=99;
  if(o.n)d=Math.min(d,Y);if(o.s)d=Math.min(d,16-Y);if(o.w)d=Math.min(d,X);if(o.e)d=Math.min(d,16-X);
  const R=4;
  if(o.n&&o.w&&X<R&&Y<R)d=Math.min(d,R-Math.hypot(R-X,R-Y));if(o.n&&o.e&&16-X<R&&Y<R)d=Math.min(d,R-Math.hypot(R-(16-X),R-Y));
  if(o.s&&o.w&&X<R&&16-Y<R)d=Math.min(d,R-Math.hypot(R-X,R-(16-Y)));if(o.s&&o.e&&16-X<R&&16-Y<R)d=Math.min(d,R-Math.hypot(R-(16-X),R-(16-Y)));

const PFX={whisperwood:'leaves',cinder:'embers',clover:'petals',burrowby:'petals',ripple:'sparkle',saltreach:'sparkle'};
let parts=[],partMap=null;
function particles(m,now,dt){const kind=m.snowy?'snow':PFX[m.id];if(partMap!==m.id){parts=[];partMap=m.id;}if(!kind)return;
  const W=VW*TS,H=VH*TS;const max={snow:60,leaves:14,embers:26,petals:10,sparkle:14,fireflies:22}[kind];
  while(parts.length<max){parts.push({x:Math.random()*W,y:Math.random()*H,v:Math.random(),p:Math.random()*6.28,life:Math.random()*4});}
  for(const q of parts){q.life+=dt;q.p+=dt*2;
    if(kind==='snow'){q.y+=dt*(10+q.v*14);q.x+=Math.sin(q.p)*dt*8-dt*4;}
    else if(kind==='leaves'){q.y+=dt*(8+q.v*8);q.x+=Math.sin(q.p)*dt*14+dt*6;}
    else if(kind==='petals'){q.y+=dt*(5+q.v*5);q.x+=Math.sin(q.p)*dt*10+dt*8;}
    else if(kind==='embers'){q.y-=dt*(8+q.v*12);q.x+=Math.sin(q.p*1.5)*dt*6;}
    else if(kind==='fireflies'){q.x+=Math.sin(q.p*.7+q.v*9)*dt*7;q.y+=Math.cos(q.p*.5+q.v*5)*dt*5;}
    if(q.y>H+4){q.y=-4;q.x=Math.random()*W;}if(q.y<-4){q.y=H+4;q.x=Math.random()*W;}if(q.x>W+4)q.x=-4;if(q.x<-4)q.x=W+4;}
  for(const q of parts){let c,s=1;
    if(kind==='snow'){c=q.v>.7?'#ffffff':'#e8f2fa';s=q.v>.8?2:1;}
    else if(kind==='leaves'){c=['#7fc85a','#a8d860','#e8a840'][Math.floor(q.v*3)];s=2;}
    else if(kind==='petals'){c=q.v>.5?'#ffc2d4':'#ffffff';s=q.v>.8?2:1;}
    else if(kind==='embers'){c=Math.sin(q.p*3)>0?'#ffb347':'#fff07a';ctx.globalAlpha=.8;}
    else if(kind==='fireflies'){const a=.4+.6*Math.max(0,Math.sin(q.p*1.2+q.v*20));ctx.globalAlpha=a;c=q.v>.5?'#e8ff8a':'#fff07a';ctx.fillStyle='rgba(240,255,140,.25)';ctx.fillRect(Math.round(q.x)-1,Math.round(q.y)-1,3,3);}

  return `<div class="lookGrid">${row('style','Hair')+row('hair','Hair color')+row('eyes','Eyes')+row('skin','Skin')+row('face','Face')+row('top','Top')+row('outfit','Top color')+row('accent','Accent')+row('pants','Pants')+row('shoes','Shoes')}</div><button class="btn sm" id="lkRand">🎲 Randomize look</button>`;

  for(const k in LOOK_DEF)if(!look[k])look[k]=LOOK_DEF[k];
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{const k=b.dataset.lk,a=arrs[k];const nm=$('#nm');const keep=nm?nm.value:null;let i=a.indexOf(look[k]);if(i<0)i=0;else i=(i+(+b.dataset.d)+a.length)%a.length;look[k]=a[i];render();if(nm&&$('#nm'))$('#nm').value=keep;const nb=document.querySelector(`[data-lk="${k}"][data-d="${b.dataset.d}"]`);nb&&nb.focus();});
  const r=$('#lkRand');if(r)r.onclick=()=>{const nm=$('#nm');const keep=nm?nm.value:null;for(const k in arrs)look[k]=pick(arrs[k]);render();if(nm&&$('#nm'))$('#nm').value=keep;};};
UI.wardrobe=function(back){return new Promise(res=>{const look=G.player.look;const render=()=>{this.show(`<h2>Appearance</h2><div class="scroll"><div class="creator"><div class="preview" id="pv"></div><div class="col">${this.lookControls(look)}</div></div><p class="small center">Hats and outfits from your Gear are worn over this look.</p></div><div class="row"><button class="btn primary" data-back id="done">Looking good!</button></div>`);
  const pv=$('#pv');['down','right','up'].forEach(d=>pv.appendChild(personCanvas(look,5,d)));this.bindLook(look,render);$('#done').onclick=()=>{for(const k in personCache)delete personCache[k];if(back)back();else this.close();res();};};render();});};

async function neviScene(api){
  if(flag('badge4')){await say('Warden Nevi: The scarf will keep the blizzard at bay. Whistle Peak is east of the village. Be gentle with the mountain.');return;}
  if(!flag('badge3')){await say('Warden Nevi: Come back when you have more badges, little snowflake.');return;}
  await say('Warden Nevi: Ah... a traveler from the south. I am Nevi, Warden of the Frost Badge.');
  await say('Warden Nevi: Winter is not cruel. It is quiet, and patient. Show me you understand.');
  if(await ask('Warden Nevi: Shall we?',['Let\'s battle!','Not yet'])!==0)return;
  const won=await api.battle({name:'Warden Nevi',look:LOOKS.nevi,team:[['glacihare',28],['emperguin',29],['yetitan',31]],prize:3200,lose:'Warden Nevi: ...Beautiful. Like the first snowfall.',warden:true});
  if(!won)return;
  G.player.badges.push('Frost');G.flags.badge4=1;await say('You received the Frost Badge!');
  const c=await ask('Warden Nevi: What do you feel, standing in the snow?',['Peaceful. Everything is so quiet.','Ready for the next challenge!']);addRep(c===0?'heart':'grit',2);
  await say('Warden Nevi: Take my earmuffs. They were knitted with Yetot fluff — warm enough to walk through any blizzard.');giveGear('earmuffs');await say('You received the Fluffy Earmuffs (gear)! The blizzard to the east no longer blocks you.');
  api.give('candy',4);gainTamerXp(160);saveGame();
}
async function ariaScene(api){
  if(flag('badge5')){await say('Warden Aria: Go to the summit. Aurorion has been alone a very long time.');return;}
  await say('Warden Aria: You climbed through the blizzard? Impressive! I\'m Aria, Warden of the Gust Badge.');
  await say('Warden Aria: Up here, the wind is everything. Let\'s see if you can fly!');
  if(await ask('Warden Aria: Ready to take off?',['Let\'s fly!','Not yet'])!==0)return;
  const won=await api.battle({name:'Warden Aria',look:LOOKS.aria,team:[['galeon',31],['aurorowl',32],['tempestork',34]],prize:3600,lose:'Warden Aria: What a gust! You blew me away!',warden:true});
  if(!won)return;
  G.player.badges.push('Gust');G.flags.badge5=1;await say('You received the Gust Badge!');
  await say('Warden Aria: The wind from the summit... it\'s Aurorion\'s song. It has been sad for so long, and the snow never stops.');
  const c=await ask('Warden Aria: Will you go to it?',['I\'ll keep it company.','I\'ll face it head on!']);addRep(c===0?'heart':'grit',1);
  await say('Warden Aria: I\'ll calm the winds so you can pass. Good luck up there.');
  api.give('candy',4);gainTamerXp(180);saveGame();
}
async function aurorionScene(api){
  if(flag('aurorion'))return;
  await say('The air glitters. A great rascal made of starlight and snow lifts its head and looks at you.');
  await say('Aurorion: ...Hrrmmm...');
  const c=await ask('What do you do?',['Sit beside it quietly','Offer it a treat','Challenge it!']);
  if(c===0||c===1){addRep('heart',2);
    if(c===1&&!Object.keys(G.bag).some(k=>G.bag[k]>0&&ITEMS[k].kind==='dish')){await say('You search your bag... but you have no dishes to share. Aurorion tilts its head.');}
    if(rep('heart')>=10){await say('Aurorion watches you for a long time. Then it lowers its head and gently nuzzles your hand.');
      await say('The snow slows... and above the peak, the aurora blooms across the sky! 🌌');
      const m=makeMon('aurorion',40,{bond:200,shiny:false,caughtAt:'Whistle Peak summit'});m.genes=Object.fromEntries(STAT_KEYS.map(k=>[k,rnd(10,15)]));m.hp=stats(m).hp;
      markCaught('aurorion');await say('Aurorion has decided to join you!');await UI.nickname(m);if(G.party.length<6)G.party.push(m);else G.storage.push(m);
      await endCh3();return;}
    await say('Aurorion seems curious about you... but it isn\'t sure yet. It rises, ready to test your heart in battle!');
  } else {addRep('grit',2);await say('Aurorion lets out a ringing cry that echoes across the peak!');}
  await battleTransition();
  const m=makeMon('aurorion',40,{shiny:false});m.genes=Object.fromEntries(STAT_KEYS.map(k=>[k,rnd(8,15)]));m.hp=stats(m).hp;
  const r=await Battle.start({kind:'wild',foes:[m]});
  if(r==='caught'){await say('Aurorion has joined you! The snow slows... and the aurora blooms across the sky! 🌌');await endCh3();}
  else if(r==='win'){await say('Aurorion fades into the falling snow... It may return if you come back to the summit.');}
  else await say('Aurorion watches you go, still waiting on the summit.');
}
async function endCh3(){G.flags.aurorion=1;giveGear('auroracharm');await say('Something glitters in the snow where Aurorion rested... You found the Aurora Charm (gear)!');gainTamerXp(250);saveGame();
  await say('🎉 You finished Chapter 3! Five badges, and the aurora shines again. More of Hollowvale awaits in the next update!');}
async function yetiKids(api){
  const q=G.quests.yeti_friend;
  if(q==='done'){await say('Pip-squeak: Our snow-rascal looks EXACTLY like your Yetot now! Best snow-rascal ever!');return;}
  const has=G.party.find(m=>['yetot','yetitan'].includes(m.sp));
  if(q==='active'&&has){await say(`Pip-squeak: WHOA! A real ${SPECIES[has.sp].name}! It's so fluffy!`);await say('The kids build a snow-rascal of your Yetot. It is lumpy, but full of love.');
    giveGear('wintercoat');addRep('heart',1);await say('Pip-squeak: My mom made this coat but it\'s way too big. You have it!');await say('You got the Winter Coat (gear)!');questDone('yeti_friend');return;}
  if(q==='active'){await say('Pip-squeak: Have you found a Yetot yet? They live on Frostpine Trail and Whistle Peak!');return;}
  await say('Pip-squeak: We\'re building a snow-rascal, but we\'ve never seen a real Yetot up close...');
  if(await ask('Help the kids?',['I\'ll bring one!','Maybe later'])===0){questStart('yeti_friend');addRep('heart',1);}
}
async function cocoaScene(api){
  const q=G.quests.hot_cocoa;
  if(q==='done'){await say('Mama Brew: Cocoa\'s always on for you, sweetie! Here, have a warm cup.');healParty();await say('Your rascals sip cocoa and feel warm and cozy. (Fully healed!)');return;}
  if(q==='active'&&(G.bag.milk||0)>=3&&(G.bag.honey||0)>=2){G.bag.milk-=3;G.bag.honey-=2;await say('Mama Brew: Milk AND honey! Now the whole village gets cocoa tonight!');
    G.bag.honeymilk=(G.bag.honeymilk||0)+3;G.bag.feast=(G.bag.feast||0)+1;addRep('heart',2);await say('You got 3 Honey Milk and a Rainbow Feast!');questDone('hot_cocoa');return;}
  if(q==='active'){await say(`Mama Brew: I need 3 Moo Milk and 2 Wild Honey (you have ${G.bag.milk||0} and ${G.bag.honey||0}).`);return;}
  await say('Mama Brew: Welcome to my little café! Oh, but I\'m all out of milk and honey for my cocoa...');
  if(await ask('Help Mama Brew?',['I\'ll bring some!','No thanks'])===0){questStart('hot_cocoa');addRep('heart',1);}
}

async function blazeScene(api){
  if(flag('badge6')){await say('Warden Blaze: Keep that fire burning! Duskmire Woods is north past the Ashen Path.');return;}
  await say('Warden Blaze: HAH! A challenger! I\'m Blaze, Warden of the Ember Badge, and this forge is my home!');
  if(!flag('badge5')){await say('Warden Blaze: Come back with five badges, kid!');return;}
  if(await ask('Warden Blaze: Ready to feel the heat?',['Fire away!','Not yet'])!==0)return;
  const won=await api.battle({name:'Warden Blaze',look:LOOKS.blaze,team:[['pyrobat',35],['magmaul',36],['blazewing',37],['wyvernal',38]],prize:4200,lose:'Warden Blaze: WHOA! You put out my fire!',warden:true});
  if(!won)return;G.player.badges.push('Ember');G.flags.badge6=1;await say('You received the Ember Badge!');
  const c=await ask('Warden Blaze: What keeps YOUR fire lit?',['My friends and rascals','The thrill of the fight!']);addRep(c===0?'heart':'grit',2);
  giveGear('emberscarf');await say('Warden Blaze: Take my Ember Scarf. Forged it myself!');await say('You received the Ember Scarf (gear)!');api.give('candy',4);gainTamerXp(200);saveGame();
}
async function forgeQuest(api){
  const q=G.quests.forge;
  if(q==='done'){await say('Smith Anvil: Forge is roaring! Need anything? Ha, I mostly make cookie cutters these days.');return;}
  if(q==='active'&&(G.bag.pepper||0)>=5){G.bag.pepper-=5;await say('Smith Anvil: FIVE Ember Peppers! Now THAT\'s fuel!');G.bag.wakeseed=(G.bag.wakeseed||0)+3;G.bag.goldberry=(G.bag.goldberry||0)+3;addRep('heart',1);await say('You got 3 Wake Seeds and 3 Golden Berries!');questDone('forge');return;}
  if(q==='active'){await say(`Smith Anvil: Need 5 Ember Peppers (you have ${G.bag.pepper||0}). Ember rascals at your ranch gather them!`);return;}
  await say('Smith Anvil: This is Emberfall\'s workshop. Sadly my forge is getting cold... I need Ember Peppers to stoke it.');
  if(await ask('Help Smith Anvil?',['I\'ll find some peppers!','Not now'])===0){questStart('forge');addRep('heart',1);}
}
async function morrowScene(api){
  if(flag('badge7')){await say('Warden Morrow: The light is just beyond the woods. Lumina awaits you.');return;}
  if(!flag('badge6')){await say('Warden Morrow: ...Come back when the fire of Emberfall burns in your badge case.');return;}
  await say('Warden Morrow: Shh... the shadows are listening. I am Morrow, Warden of the Shade Badge.');
  await say('Warden Morrow: Shadows are not scary. They only exist because there is light. Remember that.');
  if(await ask('Warden Morrow: Shall we dance in the dark?',['Let\'s go','Not yet'])!==0)return;
  const won=await api.battle({name:'Warden Morrow',look:LOOKS.morrow,team:[['umbrafox',40],['gloomwraith',41],['banditail',41],['hexmyst',42]],prize:4600,lose:'Warden Morrow: ...You shine brightly. Well done.',warden:true});

}
async function celesteScene(api){

  if(!flag('badge7')){await say('Warden Celeste: Oh, a visitor! Come back when you\'ve braved Duskmire\'s Warden, sweetheart.');return;}

async function leagueScene(api){
  if(G.player.badges.length<8){await say(`The doors of Starfall Tower are sealed. A plaque reads: "Only those with all eight badges may enter." (You have ${G.player.badges.length}.)`);return;}
  const champ=flag('champion');
  if(await ask(champ?'Starfall Tower: Challenge the League again? (Rematch teams are stronger!)':'Starfall Tower: Enter the League? You\'ll face battles back to back, with a full heal in between.',['Enter!','Not yet'])!==0)return;
  const bonus=champ?8:0;
  healParty();
  await say('You climb the spiraling stairs of Starfall Tower. At the first landing, someone is waiting...');
  await say('Andrew: Hey, slowpoke! Ha, of course it\'s you. Who else would it be?');
  await say('Andrew: We started on the same day, with the same Professor. I\'ve been chasing you this whole time. Not today!');
  const rs=G.flags.rivalStarter||'emberkit';const fin=SPECIES[SPECIES[rs].evo.to].evo.to;
  let won=await api.battle({name:'Andrew W.',look:LOOKS.pip,team:[['tempestork',46+bonus],['voltbeetle',46+bonus],['krabastion',47+bonus],['galeon',47+bonus],[fin,50+bonus]],prize:6000,lose:'Andrew: ...Yeah. You earned it. Go on. Go win the whole thing!',noBlackout:true});
  if(!won){await say('Andrew: Ha! Come back and try again, okay? I\'ll be here!');return;}
  if(!champ){const c=await ask('Andrew looks at you with a grin.',['Thanks for always pushing me, Andrew.','Told you I\'d win!']);addRep(c===0?'heart':'grit',2);}
  healParty();await say('Your rascals were healed. You climb to the very top of Starfall Tower...');
  await say('A familiar figure stands under the stars, holding a mug of cocoa.');
  if(!champ){await say('Grandma Juniper: Well, well! There\'s my sweetpea!');
    await say('Grandma Juniper: Surprised? Who do you think was Champion before you were even born, dear? I just never mentioned it. Didn\'t want you to feel any pressure!');
    await say('Grandma Juniper: Now then. Let\'s see how much you\'ve grown. I won\'t go easy on you — that wouldn\'t be fair!');}
  else await say('Grandma Juniper: Back for more, Champion? Grandma has been training too, you know!');
  const mine=G.flags.myStarter||{emberkit:'sprigling',puddlepip:'emberkit',sprigling:'puddlepip'}[rs];const fs=['puddlepip','sprigling','emberkit','snowcub','glintling','zippup'].find(s=>s!==rs&&s!==mine);
  const gfin=SPECIES[SPECIES[fs].evo.to].evo.to;
  won=await api.battle({name:'Champion Juniper',look:LOOKS.grandma,team:[['snoozle',50+bonus],['fluffern',50+bonus],['galeon',51+bonus],['yetitan',51+bonus],['toadstoll',51+bonus],[gfin,54+bonus]],prize:10000,lose:'Grandma Juniper: Oh my... oh my! My little sweetpea is the Champion!',warden:true,noBlackout:true});
  if(!won){await say('Grandma Juniper: Not quite yet, dear! Come home, have some cocoa, and try again.');return;}
  if(!champ){G.flags.champion=1;giveGear('championcrown');addRep('heart',2);addRep('grit',2);
    await say('Grandma Juniper: I\'m so proud of you. Here — this crown has waited a long time for its next owner.');await say('You received the Champion\'s Crown (gear)!');
    G.player.money+=10000;gainTamerXp(500);saveGame();await hallOfFame();
    await say('Grandma Juniper: Now, come home for dinner. The ranch rascals miss you!');
    await changeMap('burrowby',3,5,'down');
    await say('🌟 Congratulations, Champion! The adventure continues: rematch the League in Starfall Tower, chase rare colors, breed perfect genes, and complete your Pouchdex!');
  } else {G.player.money+=10000;gainTamerXp(300);saveGame();await say('Grandma Juniper: Still the Champion! Here\'s your prize money, dear. Don\'t spend it all on Honey Drops.');}
}
async function hallOfFame(){
  return new Promise(res=>{const ov=$('#overlay');ov.className='active';mode='battle';
    ov.innerHTML=`<div class="hof"><div class="hofStars"></div><h1>Hall of Fame</h1><div class="hofTamer" id="hofT"></div><div class="hofTeam">${G.party.map((m,i)=>`<div class="hofMon" style="animation-delay:${.4+i*.35}s"><img class="pix" src="${spriteURL(m.sp,m.hue)}"><b>${esc(monName(m))}</b><small>Lv ${m.lv} ${SPECIES[m.sp].name}</small></div>`).join('')}</div>
      <div class="credits"><p><b>POUCH RASCALLS</b></p><p>Designed by you · Built with Claude</p><p>${Object.keys(G.dex.caught).length} rascals caught · ${fmtTime(G.play)} played · “${tamerTitle()}”</p><p>Thank you for playing!</p></div>
      <button class="btn primary big" id="hofOk">Continue ▶</button></div>`;
    $('#hofT').appendChild(personCanvas(playerLook(),6));$('#hofOk').onclick=()=>{UI.close();mode='world';res();};UI.focusFirst();});
}

// ---- RANCH UPGRADES ----
const RANCH_LV=[null,{inc:4,prod:50},{inc:6,prod:35,cost:3000},{inc:8,prod:25,cost:8000,rare:1}];
function ranchLv(){return (G.ranch&&G.ranch.level)||1;}
maxInc=function(){return RANCH_LV[ranchLv()].inc;};
const _careCD4=careCD;careCD=function(){return Math.max(25,_careCD4()-(ranchLv()>=3?10:0));};
const _tabPen=Ranch.tab_pen;
Ranch.tab_pen=function(){const lv=ranchLv(),nx=RANCH_LV[lv+1];
  return _tabPen.call(this)+`<div class="upg"><b>🏡 Ranch Level ${lv}</b> <small>· Incubator ${maxInc()} eggs · gathers every ${RANCH_LV[lv].prod} steps${RANCH_LV[lv].rare?' · finds rare treats':''}</small>
    ${nx?`<div class="small">Next level: ${nx.inc}-egg incubator, gathering every ${nx.prod} steps${nx.rare?', rare treats like Golden Berries and Honey Drops, and faster care':''}.</div><button class="btn sm primary" id="rUpg" ${G.player.money<nx.cost?'disabled':''}>Upgrade for 💰${nx.cost}</button>`:'<div class="small">Your ranch is fully upgraded! Grandpa Thistle is beaming.</div>'}</div>`;};
const _bindPen=Ranch.bind_pen;
Ranch.bind_pen=function(){_bindPen.call(this);const b=$('#rUpg');if(b)b.onclick=async()=>{const nx=RANCH_LV[ranchLv()+1];const c=await UI.choose(`Upgrade the ranch for ${nx.cost} coins?`,['Upgrade!','Cancel']);if(c!==0)return;G.player.money-=nx.cost;G.ranch.level=ranchLv()+1;await UI.alert('Grandpa Thistle: Hammer, hammer, saw, saw... Done! The ranch looks wonderful!');saveQuiet();this.render('pen');};};
const _prod=ranchProduce;
ranchProduce=function(){const r=G.ranch;const ps=RANCH_LV[ranchLv()].prod;let periods=Math.floor((G.steps-r.lastProd)/ps);if(periods<=0)return;periods=Math.min(periods,14);r.lastProd=G.steps;
  const workers=G.storage.slice(0,10+ranchLv()*2);let total=Object.values(r.produce).reduce((a,b)=>a+b,0);const cap=40+ranchLv()*20;
  for(let p=0;p<periods;p++)for(const m of workers){if(total>=cap)break;if(Math.random()<.6){let it=pick(PRODUCE[pick(SPECIES[m.sp].types)]);if(RANCH_LV[ranchLv()].rare){const q=Math.random();if(q<.03)it='candy';else if(q<.07)it='goldberry';}r.produce[it]=(r.produce[it]||0)+1;total++;}}};

function dayPhase(){const h=new Date().getHours()+new Date().getMinutes()/60;if(h>=6.5&&h<17)return {k:'day'};if(h>=17&&h<19.5)return {k:'dusk',a:Math.min(1,(h-17)/1.2)};if(h>=5&&h<6.5)return {k:'dawn',a:1-(h-5)/1.5};return {k:'night'};}

render=function(now){_render2(now);const m=curMap();if(!SND.cfg.daynight||m.indoor||m.bg==='cave'||m.id==='duskmire')return;const ph=dayPhase();if(ph.k==='day')return;
  let camX,camY,px=G.x*TS,py=G.y*TS;if(P.moving){const mv=P.moving;px=(mv.fx+(mv.tx-mv.fx)*mv.t)*TS;py=(mv.fy+(mv.ty-mv.fy)*mv.t)*TS;}
  camX=px-(VW*TS)/2+TS/2;camY=py-(VH*TS)/2+TS/2;camX=m.w<=VW?(m.w-VW)*TS/2:Math.max(0,Math.min(m.w*TS-VW*TS,camX));camY=m.h<=VH?(m.h-VH)*TS/2:Math.max(0,Math.min(m.h*TS-VH*TS,camY));camX=Math.round(camX);camY=Math.round(camY);
  const night=ph.k==='night'?1:(ph.a||0);
  ctx.save();
  if(ph.k==='dusk'||ph.k==='dawn'){ctx.fillStyle=`rgba(255,120,60,${.14*(1-night*.4)})`;ctx.fillRect(0,0,cv.width,cv.height);}
  if(night>0){ctx.fillStyle=`rgba(18,24,70,${.42*night})`;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation='lighter';
    const x0=Math.floor(camX/TS)-1,y0=Math.floor(camY/TS)-1;
    for(let y=y0;y<=y0+VH+2;y++)for(let x=x0;x<=x0+VW+2;x++){const t=tileAt(m,x,y);if(t!=='O'&&t!=='D')continue;const cx=x*TS-camX+8,cy=y*TS-camY+(t==='D'?6:7);
      const g=ctx.createRadialGradient(cx,cy,1,cx,cy,t==='D'?14:12);g.addColorStop(0,`rgba(255,200,90,${.55*night})`);g.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=g;ctx.fillRect(cx-16,cy-16,32,32);}
    const sx=px-camX+8,sy=py-camY+6;const g=ctx.createRadialGradient(sx,sy,2,sx,sy,34);g.addColorStop(0,`rgba(255,220,150,${.18*night})`);g.addColorStop(1,'rgba(255,220,150,0)');ctx.fillStyle=g;ctx.fillRect(sx-40,sy-40,80,80);}
  ctx.restore();
};

const FOL={x:0,y:0,fx:0,fy:0,dir:'down',on:false};
function followerMon(){return G&&G.party.find(m=>m.hp>0);}
function followerReset(){FOL.x=FOL.fx=G.x;FOL.y=FOL.fy=G.y;FOL.on=false;}
function followerStep(px,py){if(FOL.x===px&&FOL.y===py&&!FOL.on){FOL.on=true;}FOL.fx=FOL.x;FOL.fy=FOL.y;
  if(Math.abs(FOL.x-px)+Math.abs(FOL.y-py)>1){FOL.fx=px;FOL.fy=py;}FOL.x=px;FOL.y=py;FOL.on=true;const dx=FOL.x-FOL.fx,dy=FOL.y-FOL.fy;FOL.dir=dx>0?'right':dx<0?'left':dy<0?'up':'down';}
SND.cfg.follow=SND.cfg.follow!==false;
function followerEnt(camX,camY,now){const m=followerMon();if(!m||!SND.cfg.follow||!FOL.on)return null;
  let fx=FOL.x,fy=FOL.y;if(P.moving&&!P.moving._noFol){const t=P.moving.t;fx=FOL.fx+(FOL.x-FOL.fx)*t;fy=FOL.fy+(FOL.y-FOL.fy)*t;}
  if(Math.round(fx)===G.x&&Math.round(fy)===G.y&&!P.moving)return null;
  return {y:fy-.01,draw:()=>{const sx=Math.round(fx*TS-camX),sy=Math.round(fy*TS-camY);const bob=P.moving?Math.abs(Math.sin(now/90))*2:Math.sin(now/400);
    ctx.fillStyle='rgba(20,30,20,.22)';ctx.beginPath();ctx.ellipse(sx+8,sy+14,6,2,0,0,7);ctx.fill();
    const img=monsterSprite(m.sp,m.hue);ctx.save();if(FOL.dir==='right'){ctx.translate(sx+8,0);ctx.scale(-1,1);ctx.translate(-(sx+8),0);}ctx.drawImage(img,sx-5,sy-10-bob,26,26);ctx.restore();
    if(m.shiny&&Math.sin(now/200)>.9){ctx.fillStyle='#fff';ctx.fillRect(sx+12,sy-8,2,2);}}};}

function fishMinigame(){return new Promise(res=>{

  const fin=(ok,msg)=>{clearTimeout(t1);phase='done';$('#fishMsg').textContent=msg;$('#reel').disabled=true;setTimeout(()=>{UI.closeModal(d);res(ok);},ok?400:900);};
  d.querySelector('#reel').onclick=()=>{if(phase==='wait')fin(false,'Too early! The fish swam off.');else if(phase==='bite')fin(true,'Got one!');};

async function goFish(){

    const need=cropNeed(p),prog=Math.min(1,(G.steps-p.planted)/need);const ready=prog>=1;const icon=ready?CROPS[p.crop].e:prog<.33?'🌱':prog<.66?'🌿':'🪴';
    return `<button class="btn plot ${ready?'ready':''}" data-i="${i}"><span class="soil">${icon}</span><b>${ITEMS[p.crop].name}</b><div class="moodbar egg"><div style="width:${prog*100}%"></div></div><small>${ready?'Ready to harvest!':`${Math.max(0,need-(G.steps-p.planted))} steps`}${p.watered?' · 💧':''}</small></button>`;}).join('')}</div>

function weatherOf(m){if(!m||!SND.cfg.weather)return 'clear';if(m.indoor||m.bg==='cave')return 'clear';
  let pool;if(m.snowy)pool=['snow','snow','snow','clear'];else if(['emberfall','ashpath','crater'].includes(m.id))pool=['sun','sun','clear','clear'];
  else if(['whisperwood','duskmire'].includes(m.id))pool=['clear','fog','fog','rain'];else if(['ripple','saltreach','galebluffs'].includes(m.id))pool=['clear','clear','rain','rain','sun'];
  else if(m.enc||m.doors)pool=['clear','clear','clear','rain','sun'];else pool=['clear'];
  const slot=Math.floor(Date.now()/(1000*60*60*2));return pool[Math.floor(h2(hashStr(m.id)%9973,slot,7)*pool.length)];}
function weatherWeights(list){const w=weatherOf(curMap());const boost={rain:'Tide',sun:'Ember',fog:'Shade',snow:'Frost'}[w];if(!boost)return;for(const e of list)if(SPECIES[e[0]].types.includes(boost))e[3]*=2;}
let wparts=[],wmap='';
const _render4=render;
render=function(now){_render4(now);const m=curMap();const w=weatherOf(m);if(w==='clear')return;if(wmap!==m.id+w){wparts=[];wmap=m.id+w;}const W=VW*TS,H=VH*TS;
  if(w==='rain'){ctx.fillStyle='rgba(40,60,100,.16)';ctx.fillRect(0,0,W,H);while(wparts.length<70)wparts.push({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*.6});
    ctx.strokeStyle='rgba(200,225,255,.55)';ctx.lineWidth=1;ctx.beginPath();for(const p of wparts){p.y+=5*p.v;p.x-=1.4*p.v;if(p.y>H){p.y=-6;p.x=Math.random()*(W+40);}ctx.moveTo(Math.round(p.x),Math.round(p.y));ctx.lineTo(Math.round(p.x-2),Math.round(p.y+6));}ctx.stroke();
    if(Math.random()<.04){ctx.fillStyle='rgba(220,240,255,.5)';const x=Math.random()*W,y=Math.random()*H;ctx.fillRect(x-1,y,3,1);}}
  else if(w==='sun'){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,230,140,.22)');g.addColorStop(.5,'rgba(255,230,140,.04)');g.addColorStop(1,'rgba(255,190,90,.12)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  else if(w==='fog'){const t=now/4000;for(let i=0;i<4;i++){const x=((t*20+i*90)%(W+120))-60,y=20+i*(H/4);const g=ctx.createRadialGradient(x,y,4,x,y,80);g.addColorStop(0,'rgba(235,240,245,.35)');g.addColorStop(1,'rgba(235,240,245,0)');ctx.fillStyle=g;ctx.fillRect(x-80,y-80,160,160);}ctx.fillStyle='rgba(230,235,240,.12)';ctx.fillRect(0,0,W,H);}
};

function battleMods(att,def,mv,eff){let m=1;const aa=abilityOf(att.sp),da=abilityOf(def.sp);const low=att.hp<=stats(att).hp/3;
  if((aa==='overgrow'&&mv.t==='Leaf'||aa==='blaze'&&mv.t==='Ember'||aa==='torrent'&&mv.t==='Tide')&&low)m*=1.3;

  if(da==='fluffy'&&mv.c==='phys')m*=.75;if(da==='rockhide'&&eff>1)m*=.8;if(da==='thickcoat'&&(mv.t==='Ember'||mv.t==='Frost'))m*=.5;if(da==='auroraveil')m*=.8;
  if(att.held==='gem_'+mv.t)m*=1.2;if(att.held==='muscleband'&&mv.c==='phys')m*=1.1;if(att.held==='wiseglasses'&&mv.c==='mag')m*=1.1;

    else if(ta==='flamebody'&&ch<.25){await B.msg(`${monName(tg)}'s Flame Body scorched ${monName(me)}!`,true);await B.inflict(me,'burn',side);}
    else if(ta==='spores'&&ch<.2){await B.msg(`${monName(tg)} released a Spore Cloud!`,true);await B.inflict(me,'sleep',side);}}
  if(tg.hp>0&&tg.held&&ITEMS[tg.held]&&ITEMS[tg.held].kind==='heal'&&tg.hp<=stats(tg).hp/2){const it=ITEMS[tg.held];const h=Math.min(stats(tg).hp-tg.hp,Math.round(it.heal*healMult()));tg.hp+=h;tg.held=null;B.refresh();await B.msg(`${monName(tg)} ate its held ${it.name} and recovered ${h} HP!`,true);}

async function moveReminder(){
  await say('Granny Thyme: Ohoho! I\'m the Move Reminder. I can help a rascal remember a move it once knew... or one it could have learned by now.');
  const c=await ask('Granny Thyme: It costs one Honey Drop, or 800 coins. Which rascal?',[...G.party.map(m=>`${monName(m)} (Lv${m.lv})`),'Never mind']);if(c>=G.party.length)return;
  const m=G.party[c];const opts=[...new Set(SPECIES[m.sp].learn.filter(([l])=>l<=m.lv).map(x=>x[1]))].filter(n=>!m.moves.some(x=>x.n===n));
  if(!opts.length){await say(`Granny Thyme: ${monName(m)} already remembers everything it can. Clever little thing!`);return;}
  const mi=await ask(`Granny Thyme: Which move should ${monName(m)} remember?`,[...opts.map(n=>{const d=MOVES[n];return `${n} (${d.t} ${d.c==='status'?'status':d.p})`;}),'Never mind']);if(mi>=opts.length)return;
  if(G.player.cls==='Scholar'){await say('Granny Thyme: Ah, a fellow scholar! No charge for you, dear.');await Battle.learnMove(m,opts[mi],t=>say(t),(t,o)=>ask(t,o));return;}
  const pay=G.bag.candy>0?await ask('Pay with...',['1 Honey Drop','800 coins','Cancel']):await ask('Pay with...',['800 coins','Cancel']).then(v=>v===0?1:2);
  if(pay===2)return;if(pay===0)G.bag.candy--;else{if(G.player.money<800){await say('Granny Thyme: Oh dear, you\'re a little short on coins.');return;}G.player.money-=800;}
  await Battle.learnMove(m,opts[mi],t=>say(t),(t,o)=>ask(t,o));
}

const STATUS_INFO={burn:'Burn: loses 1/16 of max HP each turn, and its Physical moves deal half damage.',poison:'Poison: loses 1/8 of max HP each turn.',
  sleep:'Sleep: can\'t act for 1–3 turns.',para:'Paralysis: Speed is halved, and it has a 25% chance to be unable to move each turn.',chill:'Frozen: can\'t act until it thaws (25% chance each turn).'};
const STATUS_VERB={burn:'burn',poison:'poison',sleep:'put to sleep',para:'paralyze',chill:'freeze'};
const CAT_INFO={phys:['💥','Physical','Uses your Attack against the target\'s Defense.'],mag:['✨','Magic','Uses your Magic against the target\'s Resolve.'],status:['🌀','Status','Deals no damage. Applies an effect instead.']};
const statList=o=>Object.keys(o).map(k=>STAT_LABEL[k]).join(' and ');
function moveEffects(n){const d=MOVES[n],fx=d.fx||{};const out=[];
  if(fx.prio)out.push('Always strikes first, even against faster foes.');
  if(fx.st){const v=STATUS_VERB[fx.st];out.push(d.c==='status'?`${v[0].toUpperCase()+v.slice(1)}s the target${d.a<100?` (${d.a}% accurate)`:''}.`:`${fx.ch}% chance to ${v} the target.`);}
  if(fx.foe){const v=Object.values(fx.foe)[0];const ch=fx.ch&&fx.ch<100&&d.c!=='status';out.push(`${ch?`${fx.ch}% chance to lower`:'Lowers'} the target's ${statList(fx.foe)}${Math.abs(v)>1?' sharply (2 stages)':''}.`);}
  if(fx.self){const v=Object.values(fx.self)[0];out.push(`Raises your ${statList(fx.self)}${v>1?' sharply (2 stages)':''}.`);}
  if(fx.heal)out.push(fx.heal>=1?'Fully restores your HP.':`Restores ${Math.round(fx.heal*100)}% of your max HP.`);
  if(fx.cure)out.push('Also cures your status condition.');
  if(fx.selfSleep)out.push(`Then you fall asleep for ${fx.selfSleep} turns.`);
  if(fx.drain)out.push(`You recover ${Math.round(fx.drain*100)}% of the damage dealt.`);
  if(fx.recoil)out.push(`You take ${Math.round(fx.recoil*100)}% of the damage dealt as recoil.`);
  if(fx.crit)out.push('High chance of a critical hit (1 in 8 instead of 1 in 16).');
  if(fx.flinch)out.push(`${fx.flinch}% chance to make the target flinch if you move first.`);
  if(!out.length)out.push(d.c==='status'?'A supporting move.':'A straightforward attack with no extra effect.');
  if(n==='Flail')out.push('Used automatically when you are out of PP.');
  return out;}
function moveShort(n){const e=moveEffects(n)[0];return e.length>58?e.slice(0,56)+'…':e;}

function estDamage(att,def,mv,aS,dS,side){
  if(mv.c==='status')return null;const as=stats(att),ds=stats(def);
  let A=mv.c==='phys'?as.atk*stageMul(aS.atk):as.mag*stageMul(aS.mag);let D=mv.c==='phys'?ds.def*stageMul(dS.def):ds.res*stageMul(dS.res);
  if(att.status==='burn'&&mv.c==='phys')A*=.5;
  const base=Math.floor(Math.floor((2*att.lv/5+2)*movePower(att,def,mv)*(mv.fx.hits?3:1)*A/D)/50)+2;
  const stab=SPECIES[att.sp].types.includes(mv.t)?(abilityOf(att.sp)==='adaptable'?1.5:1.25):1;const eff=typeMult(mv.t,SPECIES[def.sp].types);
  let bonus=side==='a'&&G.player.cls==='Battler'?1.1:1;if(side==='a')bonus*=dmgMult(mv);if(side==='a'&&att.bond>=180)bonus*=1.05;
  const mods=typeof battleMods==='function'?battleMods(att,def,mv,eff):1;
  const lo=Math.max(1,Math.floor(base*stab*eff*.85*bonus*mods)),hi=Math.max(1,Math.floor(base*stab*eff*bonus*mods));
  return {lo,hi,eff,stab,mx:ds.hp,cur:def.hp};}
function effText(eff){return eff>=4?'Extremely effective (4×)':eff>=2?'Super effective (2×)':eff<=.25?'Barely effective (¼×)':eff<1?'Not very effective (½×)':'Normal effectiveness';}
function moveDetailHTML(n,slot){const B=Battle.B;const d=MOVES[n];const a=Battle.ally(),f=Battle.foe();const c=CAT_INFO[d.c];
  const pp=slot!=null&&a.moves[slot]?`${a.moves[slot].pp}/${d.pp}`:`${d.pp}`;
  let vs='';const est=estDamage(a,f,d,B.sa,B.sf,'a');
  if(est){const lo=Math.round(est.lo/est.mx*100),hi=Math.round(est.hi/est.mx*100);const ko=est.lo>=est.cur?' — <b>likely knocks it out!</b>':est.hi>=est.cur?' — <b>might knock it out</b>':'';
    vs=`<div class="mdVs"><span class="eff ${est.eff>1?'up':est.eff<1?'dn':''}">${effText(est.eff)}</span> vs ${monName(f)} (${SPECIES[f.sp].types.join('/')})${est.stab>1?` · <span class="stabTag">Same-type bonus +${Math.round((est.stab-1)*100)}%</span>`:''}<br>Estimated damage: <b>${lo}–${hi}%</b> of its max HP${ko}</div>`;}
  else if(d.fx&&d.fx.st&&f.status)vs=`<div class="mdVs">⚠️ ${monName(f)} already has a status condition, so this will fail.</div>`;
  const st=d.fx&&d.fx.st?`<div class="mdNote">${STATUS_INFO[d.fx.st]}</div>`:'';
  return `<div class="mdHead"><b>${n}</b> <span class="type" style="background:${TYPE_COLOR[d.t]}">${d.t}</span> <span class="catTag">${c[0]} ${c[1]}</span></div>
    <div class="mdStats">${d.c==='status'?'':`Power <b>${d.p}</b> · `}Accuracy <b>${d.a}%</b> · PP <b>${pp}</b>${d.fx&&d.fx.prio?' · <b>Priority</b>':''}</div>
    <div class="mdEff">${moveEffects(n).join(' ')}</div><div class="mdCat">${c[2]}</div>${st}${vs}`;}

function phaseIcon(){const k=dayPhase().k;return {day:'☀️',dusk:'🌇',dawn:'🌅',night:'🌙'}[k];}

dayPhase=function(){const h=SND.cfg.realClock?(new Date().getHours()+new Date().getMinutes()/60):clockHour();
  if(h>=6.5&&h<17)return {k:'day'};if(h>=17&&h<19.5)return {k:'dusk',a:Math.min(1,(h-17)/1.2)};if(h>=5&&h<6.5)return {k:'dawn',a:1-(h-5)/1.5};return {k:'night'};};

  if(!G||!G.clock||mode==='title')return;if(mode!=='world'&&mode!=='battle')return;if(UI.active()&&mode==='world')return;
  G.clock.t+=dt*(CLOCK_SPEEDS[SND.cfg.clockSpeed]||1);if(G.clock.t>=1440){G.clock.t-=1440;G.clock.day++;toast(`🌅 Day ${G.clock.day} begins!`);}}

function buildRoute(o){for(let a=0;a<80;a++){const r=tryBuildRoute(o,o.seed+a*7919);if(r)return r;}console.warn('route build failed',o.id);return null;}
function tryBuildRoute(o,seed){
  const R=mulberry(seed);const ri=(a,b)=>a+Math.floor(R()*(b-a+1));const {w,h}=o,th=o.theme;
  const g=[...Array(h)].map(()=>Array(w).fill(th.ground));const isPath=new Set(),lock=new Set();const K=(x,y)=>x+','+y;
  const inb=(x,y)=>x>=0&&y>=0&&x<w&&y<h;const set=(x,y,c)=>{if(inb(x,y))g[y][x]=c;};const get=(x,y)=>inb(x,y)?g[y][x]:null;
  const border=s=>(o.border&&o.border[s])||th.tree;const thick=s=>(o.thick&&o.thick[s])||1;
  for(let x=0;x<w;x++){const tn=thick('N')+(R()<.3?1:0),ts=thick('S')+(R()<.3?1:0);for(let k=0;k<tn;k++)set(x,k,border('N'));for(let k=0;k<ts;k++)set(x,h-1-k,border('S'));}
  for(let y=0;y<h;y++){const tw=thick('W')+(R()<.3?1:0),te=thick('E')+(R()<.3?1:0);for(let k=0;k<tw;k++)set(k,y,border('W'));for(let k=0;k<te;k++)set(w-1-k,y,border('E'));}
  const carve=(x,y,c)=>{for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]]){const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;set(X,Y,c||'=');isPath.add(K(X,Y));lock.add(K(X,Y));}};
  const ents={};const anchors={};
  for(const e of o.ents){const p=e.pos;let tiles,anc,steps=[];
    if(e.side==='N'){tiles=[[p,0],[p+1,0]];anc=[p,4];for(let y=0;y<=4;y++)steps.push([p,y]);}
    if(e.side==='S'){tiles=[[p,h-1],[p+1,h-1]];anc=[p,h-6];for(let y=h-2;y>=h-6;y--)steps.push([p,y]);}
    if(e.side==='W'){tiles=[[0,p],[0,p+1]];anc=[4,p];for(let x=0;x<=4;x++)steps.push([x,p]);}
    if(e.side==='E'){tiles=[[w-1,p],[w-1,p+1]];anc=[w-6,p];for(let x=w-2;x>=w-6;x--)steps.push([x,p]);}
    for(const [x,y] of steps)carve(x,y);for(const [x,y] of tiles){set(x,y,'=');isPath.add(K(x,y));lock.add(K(x,y));}
    ents[e.id]=tiles;anchors[e.id]=anc;}
  const lpath=(ax,ay,bx,by,vertFirst)=>{let x=ax,y=ay;const mv=(tx,ty)=>{while(x!==tx||y!==ty){if(x!==tx)x+=Math.sign(tx-x);else y+=Math.sign(ty-y);carve(x,y);}};
    if(vertFirst){const my=Math.round((ay+by)/2);mv(x,my);mv(bx,my);mv(bx,by);}else{const mx=Math.round((ax+bx)/2);mv(mx,y);mv(mx,by);mv(bx,by);}};
  // main spine through random waypoints
  const [A,B]=[anchors[o.ents[0].id],anchors[o.ents[1].id]];const vert=Math.abs(B[1]-A[1])>=Math.abs(B[0]-A[0]);
  const pts=[A];const n=o.wiggles||4;for(let i=1;i<n;i++){const t=i/n;if(vert)pts.push([ri(4,w-7),Math.round(A[1]+(B[1]-A[1])*t)]);else pts.push([Math.round(A[0]+(B[0]-A[0])*t),ri(4,h-7)]);}pts.push(B);
  for(let i=0;i<pts.length-1;i++)lpath(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],vert);
  // extra entrances join the nearest path tile
  for(const e of o.ents.slice(2)){const [ax,ay]=anchors[e.id];let best=null,bd=1e9;for(const k of isPath){const [x,y]=k.split(',').map(Number);if(x<=1||y<=1||x>=w-2||y>=h-2)continue;const d=Math.abs(x-ax)+Math.abs(y-ay);if(d<bd&&d>3){bd=d;best=[x,y];}}if(best)lpath(ax,ay,best[0],best[1],e.side==='N'||e.side==='S');}
  // pier
  let pier=null;if(o.pier){const {pos}=o.pier;const ax=w-6;lpath(anchors[o.ents[0].id][0],anchors[o.ents[0].id][1],ax,pos,false);for(let x=ax;x<w;x++)for(const y of [pos,pos+1]){set(x,y,x>=w-5?'K':'=');isPath.add(K(x,y));lock.add(K(x,y));}pier=[w-2,pos];}
  // stream with bridge
  if(th.stream){const cands=[];for(let y=Math.floor(h*.3);y<Math.floor(h*.7);y++){const row=[...Array(w).keys()].filter(x=>isPath.has(K(x,y))&&isPath.has(K(x,y+1)));if(row.length===2&&row[1]===row[0]+1&&!row.some(x=>isPath.has(K(x,y-1))&&!isPath.has(K(x,y-2))))cands.push(y);}
    if(cands.length){const y=cands[Math.floor(R()*cands.length)];for(let x=0;x<w;x++){for(const yy of [y,y+1])set(x,yy,isPath.has(K(x,yy))?'B':'W'),lock.add(K(x,yy));for(const yy of [y-1,y+2])if(!isPath.has(K(x,yy))&&get(x,yy)===th.ground){set(x,yy,th.bank||'_');lock.add(K(x,yy));}}}}
  const free=(x,y,pad)=>{for(let yy=y-pad;yy<=y+pad;yy++)for(let xx=x-pad;xx<=x+pad;xx++){if(xx<2||yy<2||xx>=w-2||yy>=h-2)return false;if(lock.has(K(xx,yy))||get(xx,yy)!==th.ground)return false;}return true;};
  const blockFree=(x0,y0,bw,bh,pad)=>{for(let y=y0-pad;y<y0+bh+pad;y++)for(let x=x0-pad;x<x0+bw+pad;x++){if(x<2||y<2||x>=w-2||y>=h-2)return false;if(lock.has(K(x,y))||get(x,y)!==th.ground)return false;}return true;};
  const pathDist=(sx,sy)=>{const seen=new Set([K(sx,sy)]);const q=[[sx,sy,0]];while(q.length){const [x,y,d]=q.shift();if(isPath.has(K(x,y)))return [d,x,y];if(d>9)continue;for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const X=x+dx,Y=y+dy,k=K(X,Y);if(seen.has(k)||!inb(X,Y))continue;if(!isPath.has(k)&&(lock.has(k)||get(X,Y)!==th.ground))continue;seen.add(k);q.push([X,Y,d+1]);}}return null;};
  const connect=(sx,sy)=>{const seen=new Map([[K(sx,sy),null]]);const q=[[sx,sy]];let end=null;while(q.length){const [x,y]=q.shift();if(isPath.has(K(x,y))){end=[x,y];break;}for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const X=x+dx,Y=y+dy,k=K(X,Y);if(seen.has(k)||!inb(X,Y))continue;if(!isPath.has(k)&&(lock.has(k)||get(X,Y)!==th.ground))continue;seen.set(k,K(x,y));q.push([X,Y]);}}
    if(!end)return false;let k=seen.get(K(end[0],end[1]));while(k){const [x,y]=k.split(',').map(Number);set(x,y,'=');lock.add(k);k=seen.get(k);}return true;};
  // buildings
  const buildings=[];
  for(const b of (o.buildings||[])){let ok=false;for(let t=0;t<400&&!ok;t++){const x=ri(3,w-9),y=ri(3,h-8);if(!blockFree(x,y,5,4,1))continue;const pd=pathDist(x+2,y+3);if(!pd||pd[0]>6||pd[0]<1)continue;
      const rows=[b.roof.repeat(5),b.roof.repeat(5),'HODOH'];rows.forEach((r,j)=>[...r].forEach((c,i)=>{set(x+i,y+j,c);lock.add(K(x+i,y+j));}));
      if(!connect(x+2,y+3))return null;lock.add(K(x+2,y+3));buildings.push({...b,door:[x+2,y+2]});ok=true;}if(!ok)return null;}
  // ponds / lava / ice
  for(let i=0;i<(o.ponds||0);i++){for(let t=0;t<200;t++){const rx=ri(2,3),ry=ri(1,2),cx=ri(4,w-6),cy=ri(4,h-6);if(!blockFree(cx-rx-1,cy-ry-1,rx*2+3,ry*2+3,0))continue;
      for(let y=cy-ry-1;y<=cy+ry+1;y++)for(let x=cx-rx-1;x<=cx+rx+1;x++){const d=((x-cx)/(rx+.5))**2+((y-cy)/(ry+.5))**2;if(d<=1){set(x,y,th.pond);lock.add(K(x,y));}else if(th.rim&&d<=1.9){set(x,y,th.rim);lock.add(K(x,y));}}break;}}
  // groves with hidden items
  const groveItems=[];const GROVE=[' TTTTT ','TT,,,TT','T,,.,,T','T,...,T','TT...TT','TTT.TTT'];
  for(let i=0;i<(o.groves||0);i++){for(let t=0;t<300;t++){const x=ri(3,w-10),y=ri(3,h-10);if(!blockFree(x,y,7,7,1))continue;
      GROVE.forEach((r,j)=>[...r].forEach((c,k)=>{if(c===' ')return;set(x+k,y+j,c===','?th.tall:c==='T'?th.tree:th.ground);lock.add(K(x+k,y+j));}));lock.delete(K(x+3,y+6));groveItems.push([x+3,y+3]);break;}}
  // decorations
  const blob=(c,r)=>{for(let t=0;t<80;t++){const cx=ri(3,w-4),cy=ri(3,h-4);if(!free(cx,cy,1))continue;for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r-1;x<=cx+r+1;x++){if(((x-cx)/(r+1.2))**2+((y-cy)/(r+.5))**2<=1&&free(x,y,0)&&!isPath.has(K(x-1,y))&&!isPath.has(K(x+1,y))&&!isPath.has(K(x,y-1))&&!isPath.has(K(x,y+1)))set(x,y,c);}return;}};
  for(let i=0;i<(o.tallPatches||6);i++)blob(th.tall,ri(1,3));
  for(let i=0;i<(o.flowerPatches||3);i++)blob(th.flower||'*',ri(0,1));
  for(let i=0;i<(o.clumps||4);i++){for(let t=0;t<60;t++){const x=ri(3,w-5),y=ri(3,h-5),bw=ri(1,3),bh=ri(1,2);if(!blockFree(x,y,bw,bh,1))continue;for(let yy=y;yy<y+bh;yy++)for(let xx=x;xx<x+bw;xx++){set(xx,yy,th.tree);lock.add(K(xx,yy));}break;}}
  for(let i=0;i<(o.rocks||5);i++){for(let t=0;t<60;t++){const x=ri(3,w-4),y=ri(3,h-4);if(!free(x,y,1))continue;set(x,y,th.rock||'r');lock.add(K(x,y));break;}}
  // spots next to the path for trainers, NPCs, bushes, signs
  const side=[];for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){if(get(x,y)!==th.ground||lock.has(K(x,y)))continue;for(const [dx,dy,dir] of [[1,0,'right'],[-1,0,'left'],[0,1,'down'],[0,-1,'up']])if(isPath.has(K(x+dx,y+dy))&&get(x+dx,y+dy)==='='){side.push({x,y,dir});break;}}
  const used=new Set();const takeSpot=(minGap)=>{const c=side.filter(s=>!used.has(K(s.x,s.y))&&[...used].every(k=>{const [ux,uy]=k.split(',').map(Number);return Math.abs(ux-s.x)+Math.abs(uy-s.y)>=minGap;}));if(!c.length)return null;const s=c[Math.floor(R()*c.length)];used.add(K(s.x,s.y));lock.add(K(s.x,s.y));return s;};
  const sorted=[];for(let i=0;i<(o.trainers||0);i++){const s=takeSpot(8);if(!s)return null;sorted.push(s);}sorted.sort((a,b)=>vert?b.y-a.y:a.x-b.x);
  const npcs=[];for(let i=0;i<(o.npcs||0);i++){const s=takeSpot(5);if(!s)return null;npcs.push(s);}
  const bush=takeSpot(4);const signS=(()=>{const [ax,ay]=anchors[o.ents[0].id];const c=side.filter(s=>!used.has(K(s.x,s.y))&&Math.abs(s.x-ax)+Math.abs(s.y-ay)<7);if(!c.length)return null;const s=c[0];used.add(K(s.x,s.y));set(s.x,s.y,'S');lock.add(K(s.x,s.y));return s;})();
  // loose items in far-off free spots
  const items=[...groveItems];for(let t=0;t<400&&items.length<(o.items||3);t++){const x=ri(2,w-3),y=ri(2,h-3);if(get(x,y)!==th.ground&&get(x,y)!==th.tall)continue;if(lock.has(K(x,y)))continue;const pd=pathDist(x,y);if(pd&&pd[0]>=3&&!items.some(([a,b])=>Math.abs(a-x)+Math.abs(b-y)<6)){items.push([x,y]);lock.add(K(x,y));}}
  const rows=g.map(r=>r.join(''));
  // validate reachability
  const pass=(x,y)=>inb(x,y)&&!BLOCK.has(rows[y][x]);const start=ents[o.ents[0].id][0];const seen=new Set([K(...start)]);const q=[start];
  const blockers=new Set([...sorted,...npcs,...(bush?[bush]:[])].map(s=>K(s.x,s.y)));
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const X=x+dx,Y=y+dy,k=K(X,Y);if(seen.has(k)||!pass(X,Y)||blockers.has(k))continue;seen.add(k);q.push([X,Y]);}}
  const reach=(x,y)=>seen.has(K(x,y));const adj=(x,y)=>[[0,1],[1,0],[0,-1],[-1,0]].some(([dx,dy])=>reach(x+dx,y+dy));
  for(const id in ents)for(const [x,y] of ents[id])if(!reach(x,y))return null;
  for(const b of buildings)if(!reach(b.door[0],b.door[1]+1))return null;
  for(const [x,y] of items)if(!reach(x,y))return null;
  for(const s of [...sorted,...npcs,...(bush?[bush]:[]),...(signS?[signS]:[])])if(!adj(s.x,s.y))return null;
  if(pier&&!reach(pier[0]-1,pier[1]))return null;
  return {rows,ents,buildings,items,trainers:sorted,npcs,bush,sign:signS,pier};
}

function inward(m,x,y){if(y===0)return [x,1];if(y===m.h-1)return [x,m.h-2];if(x===0)return [1,y];return [m.w-2,y];}
function rebuildRoute(id){const o={id,...ROUTES[id]};const r=buildRoute(o);if(!r)return;const m=MAPS[id];
  const oldNpcs=Object.fromEntries(m.npcs.map(n=>[n.id,n]));const oldDoors=m.doors||{};
  m.rows=r.rows;m.h=r.rows.length;m.w=r.rows[0].length;m.warps=[];m.signs={};m.doors={};m.triggers=[];delete GFX[id];
  if(r.sign)m.signs[r.sign.x+','+r.sign.y]=ROUTE_SIGNS[id];
  // buildings
  for(const b of r.buildings){if(b.lodge){const fn=Object.values(oldDoors)[0];const [dx,dy]=b.door;m.doors[dx+','+dy]=fn;const inn=MAPS.in_duskmire_11_7;if(inn){inn.warps[0].tx=dx;inn.warps[0].ty=dy+1;}}
    else{const h=ROUTE_HOSTS[id];makeRestHouse(id,b.door,b.name,h,h.pet);}}
  // NPC placement
  const trainers=Object.values(oldNpcs).filter(n=>n.trainer);const items=Object.values(oldNpcs).filter(n=>n.item);const others=Object.values(oldNpcs).filter(n=>!n.trainer&&!n.item&&!n.drawFn);
  const npcs=[];r.trainers.forEach((s,i)=>{const t=trainers[i];if(t){t.x=s.x;t.y=s.y;t.dir=s.dir;npcs.push(t);}});
  const spots=[...r.npcs];const qitems=items.filter(n=>n.show);const plain=items.filter(n=>!n.show);
  const itemSpots=[...r.items];for(const it of [...qitems,...plain]){const s=itemSpots.shift();if(!s)break;it.x=s[0];it.y=s[1];npcs.push(it);}
  for(const n of others){if(n.id==='gil_dock'){if(r.pier){n.x=r.pier[0];n.y=r.pier[1];n.dir='left';npcs.push(n);}continue;}const s=spots.shift();if(!s)continue;n.x=s.x;n.y=s.y;n.dir=s.dir;npcs.push(n);}
  for(const n of (ROUTE_EXTRA_NPCS[id]||[])){const s=spots.shift();if(!s)break;npcs.push({...n,x:s.x,y:s.y,dir:s.dir});}
  if(r.bush)npcs.push(makeBush(id+'_bush',r.bush));
  m.npcs=npcs;m._ents=r.ents;m._pier=r.pier;normMap(id);}

// relink warps between every rebuilt route and its neighbors
function linkPair(aId,aTiles,bId,bTiles){const A=MAPS[aId],B=MAPS[bId];const sa=[...aTiles].sort((p,q)=>p[0]-q[0]||p[1]-q[1]),sb=[...bTiles].sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
  const dirA=(m,x,y)=>y===0?'up':y===m.h-1?'down':x===0?'left':'right';
  sa.forEach(([x,y],i)=>{const [tx,ty]=inward(B,...sb[i]);A.warps=A.warps.filter(w=>!(w.x===x&&w.y===y));A.warps.push({x,y,to:bId,tx,ty,dir:({up:'down',down:'up',left:'right',right:'left'})[dirA(B,...sb[i])]});});
  sb.forEach(([x,y],i)=>{const [tx,ty]=inward(A,...sa[i]);B.warps=B.warps.filter(w=>!(w.x===x&&w.y===y));B.warps.push({x,y,to:aId,tx,ty,dir:({up:'down',down:'up',left:'right',right:'left'})[dirA(A,...sa[i])]});});}

function openSpot(mapId,px,py,taken=[]){const m=MAPS[mapId];const pass=(x,y)=>x>=0&&y>=0&&x<m.w&&y<m.h&&!BLOCK.has(m.rows[y][x]);
  const starts=[];for(const o in MAPS)for(const w of MAPS[o].warps)if(w.to===mapId&&pass(w.tx,w.ty))starts.push([w.tx,w.ty]);if(m.arrive)starts.push(m.arrive);
  const seen=new Set(starts.map(s=>s+''));const q=[...starts];while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const k=[x+dx,y+dy];if(pass(...k)&&!seen.has(k+'')){seen.add(k+'');q.push(k);}}}
  const busyT=new Set();for(const n of m.npcs)for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)busyT.add((n.x+a)+','+(n.y+b));
  for(const [x,y] of taken)for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)busyT.add((x+a)+','+(y+b));
  for(const w of m.warps)busyT.add(w.x+','+w.y);for(const k in m.doors){const [x,y]=k.split(',').map(Number);busyT.add(x+','+(y+1));}
  for(const k in m.signs){const [x,y]=k.split(',').map(Number);for(const [a,b] of [[0,1],[1,0],[-1,0],[0,-1]])busyT.add((x+a)+','+(y+b));}
  for(const t of m.triggers||[])for(let x=t.x-1;x<=t.x+t.w;x++)for(let y=t.y-1;y<=t.y+(t.h||1);y++)busyT.add(x+','+y);
  let best=null,bd=1e9;for(const s of seen){const [x,y]=s.split(',').map(Number);if(busyT.has(s)||x<1||y<1||x>=m.w-1||y>=m.h-1)continue;
    let ok=true;for(let a=-1;a<=1&&ok;a++)for(let b=-1;b<=1;b++)if(!pass(x+a,y+b)){ok=false;break;}if(!ok)continue;
    const d=Math.abs(x-px)+Math.abs(y-py)+(m.rows[y][x]===','?6:0);if(d<bd){bd=d;best=[x,y];}}
  return best;}

async function vexScene(api){
  if(G.faction==='ranger'){
    if(!qa('rg3')){await say('Vex: A Ranger in MY den? Bold.');return;}
    if(!(flag('denG1')&&flag('denG2'))){await say('Vex: My guards will deal with you, little Ranger.');return;}
    await say('Vex: So you\'re the Ranger who keeps ruining my plans. Bea\'s new favorite.');await say('Vex: Every rascal here was "borrowed." Want them back? Take them from me.');
    const won=await api.battle({name:'Jackal Queen Vex',look:LOOKS.vex,team:VEX_TEAM,prize:6000,lose:'Vex: Impossible... beaten by a goody-goody...',geneBonus:3});
    if(!won){await say('Vex: Run home, little Ranger.');return;}
    await say('Vex: ...Fine. FINE. The Nightjackals are finished. Happy?');await say('Captain Bea rushes in and takes Vex away. Dozens of stolen rascals are freed from their cages!');
    G.flags.rg_done3=1;questDone('rg3');addHonor(15,'Brought down the Nightjackals');giveGear('halo');
    const v=makeMon('valorhound',35);v.bond=150;v.caughtAt='Hollowvale Rangers';api.addMon(v);markCaught('valorhound');
    await say('Captain Bea: You did it! Hollowvale is safer because of you. Here — the Rangers\' highest honor, the Golden Halo. And this little one picked you.');
    await say('You got the Golden Halo (gear)! Valorhound joined your team! 🛡️');gainTamerXp(300);saveGame();return;}
  if(G.faction!=='jackal'){await say('Vex: Who let a stranger into my den? Get out before I change my mind.');return;}
  if(flag('jk_done3')){await say('Vex: Your Majesty. 😏 The pack is thriving. Your cut is with Pip-squeak.');return;}
  if(!qa('jk3')){await say('Vex: Not yet, pup. Finish your jobs first.');return;}
  if(!flag('vexMet')){G.flags.vexMet=1;await say('Vex: So you\'re the new talent. Slink won\'t shut up about you.');
    await say('Vex: Bad timing, though. The Rangers found our den. Captain Bea herself is at the entrance.');await say('Vex: Deal with her, and we\'ll talk about your future.');return;}
  if(!flag('jkBea')){await say('Vex: Bea\'s still at the entrance. Go!');return;}
  await say('Vex: You beat Bea. Heh. You might be the real thing.');await say('Vex: But the Nightjackals follow the strongest. If you want to lead, take the crown from me!');
  const won=await api.battle({name:'Jackal Queen Vex',look:LOOKS.vex,team:VEX_TEAM,prize:6000,lose:'Vex: Ha... the crown is yours, pup.',geneBonus:3,noBlackout:true});
  if(!won){await say('Vex: Not today. Come back when you\'re ready to rule.');return;}
  G.flags.jk_done3=1;questDone('jk3');addHonor(-10,'Claimed the Jackal Crown');giveGear('jackalcrown');
  const nj=makeMon('nightjack',35);nj.bond=150;nj.caughtAt='Nightjackal Den';api.addMon(nj);markCaught('nightjack');
  await say('Vex places the Jackal Crown on your head. The Nightjackals howl!');await say('Vex: Long live the Jackal Monarch! And Nightjack is yours now — it only follows whoever wears the crown.');
  await say('You got the Jackal Crown (gear)! Nightjack joined your team! 🗡️ Vesper\'s black market gives you a big discount now, and the den pays you a daily cut.');gainTamerXp(300);saveGame();}

// ---------- tiny matrix helpers ----------
const M4={
  persp(f,a,n,fa){const t=1/Math.tan(f/2),nf=1/(n-fa);return [t/a,0,0,0, 0,t,0,0, 0,0,(fa+n)*nf,-1, 0,0,2*fa*n*nf,0];},
  look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
    return [xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0, -(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1];},
  mul(a,b){const o=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;},
};

const R3_VS=`
attribute vec3 aPos;attribute vec2 aUV;attribute vec3 aNrm;attribute vec2 aOff;attribute float aKind;
uniform mat4 uVP;uniform vec3 uRight;uniform float uYS;uniform float uTimeV;uniform vec3 uEye;
varying vec2 vUV;varying vec3 vN;varying vec3 vW;varying float vK;varying float vD;
uniform vec3 uPl;varying float vFade;uniform vec3 uShD;uniform vec3 uShR;
void main(){
  if(aKind>5.5){vec3 q=aPos;if(aKind<6.5)q=aPos+uShR*aOff.x+uShD*aOff.y;else q.xz+=uShD.xz*max(aPos.y,0.);q.y=aKind<6.5?max(.012,aPos.y+.012):.012;vW=q;vUV=aUV;vN=vec3(0.,1.,0.);vK=aKind;vFade=0.;q.y*=uYS;vD=distance(q,uEye);gl_Position=uVP*vec4(q,1.);return;}
 vec3 base=aPos+uRight*aOff.x;vFade=0.;
  if(aKind>3.5&&aKind<4.5){base+=uRight*sin(uTimeV*1.4+aPos.x*.8+aPos.z*.55)*.04*aOff.y;float dz=aPos.z-uPl.z,dx=abs(aPos.x-uPl.x);if(dz>.05&&dz<2.6&&dx<1.5&&aOff.y>.4)vFade=1.;}
  vec3 p=base;p.y+=aOff.y;
  vW=p;vUV=aUV;vN=aNrm;vK=aKind;p.y*=uYS;vD=distance(p,uEye);vec4 cu=uVP*vec4(p,1.);
  if(aKind>1.5&&aKind!=3.){vec4 cb=uVP*vec4(base.x,base.y*uYS,base.z,1.);cu.x=cb.x/cb.w*cu.w+(p.x-base.x)*0.;}
  gl_Position=cu;}`;
const R3_FS=`
precision mediump float;

const _interactHome=interact;
interact=function(){const m=curMap();if(m.home!==undefined){const [dx,dy]=DIRS[G.dir];const t=tileAt(m,G.x+dx,G.y+dy);
  if(t==='b'&&!npcAt(G.x+dx,G.y+dy)){runScript(async()=>{const c=await ask(`It's ${clockStr()}. Sleep in your own bed?`,['Sleep until morning','Nap for an hour','Not now']);if(c===2)return;
    await fade(true);if(c===0){if(G.clock.t>=7*60)G.clock.day++;G.clock.t=7*60;healParty();for(const p of G.party)for(const mv of p.moves)mv.pp=MOVES[mv.n].pp;homeD().rested=G.clock.day;}else{G.clock.t+=60;if(G.clock.t>=1440){G.clock.t-=1440;G.clock.day++;}}
    await sleep(500);await fade(false);

// ---------- placement rules ----------
function homeCheck(room,items){const [w,h]=homeSize(room);const base=room==='main'?null:HROOMS[room].rows;const blocked=new Set(),walls=new Set();
  const st=homeStations(room);for(const [,x,y] of st)blocked.add(x+','+y);
  const tile=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return 'Z';if(base)return base[y][x];return y===0||y===h-1?'Z':'w';};
  const occ={};
  for(const it of items){if(it.room!==room)continue;const f=furnOf(it.id);for(const [x,y] of itemCells(it)){const k=x+','+y;if(occ[k])return 'Two things can\'t share a spot.';occ[k]=1;
    if(x<0||y<0||x>=w||y>=h)return 'That doesn\'t fit there.';const t=tile(x,y);
    if(f.wall){if(y!==0||t!=='Z')return 'That goes on the back wall.';}
    else if(y===0){if(!f.wallOk||t!=='Z')return 'Only shelves, ovens, windows, paintings and fireplaces go on the wall.';}
    else if(t!=='w'&&t!=='a'&&t!=='u')return 'There\'s already something built there.';
    if(st.some(([,sx,sy])=>sx===x&&sy===y))return 'Something important is already there.';
    if(y>0&&!f.walk)blocked.add(k);}}
  if(room==='main')for(const sx of homeSlots()){if(occ[sx+',0']||occ[sx+',1'])return 'Keep the doorway spaces clear.';}
  // everything important must stay reachable from the door mat
  const [mx,my]=homeMat(room);const pass=(x,y)=>x>=0&&y>0&&x<w&&y<h-1&&!blocked.has(x+','+y)&&(base?'wau'.includes(base[y][x])||occ[x+','+y]:true);
  const start=[mx,my-1];if(!pass(...start))return 'Keep the space in front of the door clear.';const seen=new Set([start+'']);const q=[start];
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[x+dx,y+dy];if(pass(...n)&&!seen.has(n+'')){seen.add(n+'');q.push(n);}}}
  const reach=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>seen.has((x+dx)+','+(y+dy)));
  if(room==='main')for(const sx of homeSlots().slice(0,homeD().rooms.length))if(!seen.has(sx+',1'))return 'That would block a doorway.';
  for(const [,x,y] of st)if(!reach(x,y))return 'That would block something you need to reach.';
  for(const it of items){if(it.room!==room)continue;const f=furnOf(it.id);if(f.t==='b'&&!itemCells(it).some(([x,y])=>reach(x,y)))return 'You need to be able to reach your bed.';}
  return null;}
function homeFixItems(){const h=homeD();for(const room of ['main',...h.rooms]){let guard=0;while(homeCheck(room,h.items)&&guard++<50){const i=h.items.map((it,j)=>it.room===room?j:-1).filter(j=>j>=0).pop();if(i===undefined)break;const it=h.items.splice(i,1)[0];h.inv[it.id]=(h.inv[it.id]||0)+1;}}}
function homeRefresh(){if(G.map==='home'||G.map.startsWith('home_')){const m=MAPS[G.map];if(!m)return;if(BLOCK.has(tileAt(m,G.x,G.y))||npcAt(G.x,G.y)){const [x,y]=homeMat(m.home);G.x=x;G.y=y-1;}}}

// ===================== MOODS, PERSONALITIES & TEAM CHEMISTRY =====================
const PERSONA={
  Fiery:{t:['Brave','Feisty'],icon:'🔥',col:'#e2584f',desc:'Lives for battle. Winning fires it up; sitting around bores it.',friends:['Playful','Steady'],clash:['Gentle']},
  Steady:{t:['Hardy','Bold'],icon:'🪨',col:'#a8845a',desc:'Dependable and hardworking. Its mood rarely swings.',friends:['Fiery','Gentle'],clash:['Playful']},
  Gentle:{t:['Gentle','Calm'],icon:'🌸',col:'#f08fb0',desc:'Sweet and caring. Loves pampering, dislikes rough fights.',friends:['Steady','Dreamy'],clash:['Fiery']},
  Playful:{t:['Jolly','Zippy'],icon:'🎈',col:'#4a90d9',desc:'Bursting with energy. Loves walks, play and exploring.',friends:['Fiery','Dreamy'],clash:['Steady']},
  Dreamy:{t:['Dreamy','Sleepy','Clever'],icon:'🌙',col:'#8a6aa8',desc:'A thoughtful night owl. Loves rain, night and quiet company.',friends:['Gentle','Playful'],clash:[]},
};
function persona(m){for(const k in PERSONA)if(PERSONA[k].t.includes(m.temp))return k;return 'Steady';}
function chem(a,b){const pa=persona(a),pb=persona(b);if(pa===pb||PERSONA[pa].friends.includes(pb))return 1;if(PERSONA[pa].clash.includes(pb)||PERSONA[pb].clash.includes(pa))return -1;return 0;}
function partyChem(m){let f=0,c=0;if(!G.party.includes(m))return {f,c};for(const o of G.party){if(o===m)continue;const k=chem(m,o);if(k>0)f++;else if(k<0)c++;}return {f,c};}
function moodTier(v){return v>=85?{k:'ecstatic',n:'Ecstatic',e:'🤩'}:v>=65?{k:'happy',n:'Happy',e:'😊'}:v>=40?{k:'content',n:'Content',e:'🙂'}:v>=20?{k:'grumpy',n:'Grumpy',e:'😒'}:{k:'miserable',n:'Miserable',e:'😞'};}
moodTag=function(m){const t=moodTier(m.mood??60);return `${t.e} ${t.n}`;};
function addMood(m,n){m.mood=Math.max(0,Math.min(100,(m.mood??60)+n));}

// ---------- battle: mood and chemistry change how hard they hit and whether they listen ----------
const _battleModsMood=battleMods;
battleMods=function(att,def,mv,eff){let k=_battleModsMood(att,def,mv,eff);if(G&&G.party.includes(att)){const v=att.mood??60;k*=v>=85?1.1:v>=65?1.05:v<20?.9:v<40?.96:1;
  const {f,c}=partyChem(att);const hm=hasSkill('harmony');k*=1+Math.min(hm?.24:.12,f*(hm?.06:.03))-c*(hm?.02:.04);if(hasSkill('fightingspirit')&&v>=65)k*=1.08;}return k;};
const _useMoveMood=Battle.useMove;
Battle.useMove=async function(side,mv,slot,first){
  if(side==='a'){const m=this.ally();const v=m.mood??60;if(m&&m.status!=='sleep'&&mv!=='Flail'&&Math.random()<(v<20?.12:v<35?.05:0)){
    await this.msg(pick([`${monName(m)} is sulking and won't listen...`,`${monName(m)} huffs and turns away.`,`${monName(m)} isn't in the mood to fight.`]),true);return;}}
  return _useMoveMood.call(this,side,mv,slot,first);};
const _finishMood=Battle.finish;
Battle.finish=async function(res){const B=this.B;const parts=B&&B.parts?[...B.parts]:[];const before=new Map(G.party.map(m=>[m.uid,m.mood??60]));
  await _finishMood.call(this,res);const won=res==='win'||res==='caught';
  for(const m of G.party){if(!parts.includes(m.uid))continue;const p=persona(m);
    if(p==='Fiery')addMood(m,won?7:-2);else if(p==='Gentle')addMood(m,won?-1:-4);else if(p==='Playful')addMood(m,won?3:0);else if(p==='Steady')m.mood=Math.round((m.mood+before.get(m.uid))/2);else addMood(m,won?1:-1);
    if(m.hp<=0)addMood(m,-5);}};

// ---------- daily mood drift ----------
function moodNewDay(){const all=[...G.party,...G.storage];const rain=typeof weatherOf==='function'&&weatherOf(curMap())==='rain';
  for(const m of all){const p=persona(m);const pull=p==='Steady'?.1:.22;const base=55+(hasSkill('moodmaker')?10:0)+(G.player.cls==='Caretaker'?5:0);m.mood=Math.round((m.mood??60)+(base-(m.mood??60))*pull);
    if(p==='Fiery'&&!G.party.includes(m))addMood(m,-3);if(p==='Playful'&&G.party.includes(m))addMood(m,2);if(p==='Dreamy'&&rain)addMood(m,3);}
  for(let i=0;i<G.party.length;i++)for(let j=i+1;j<G.party.length;j++){const k=chem(G.party[i],G.party[j]);if(k>0){addMood(G.party[i],3);addMood(G.party[j],3);}else if(k<0){addMood(G.party[i],-4);addMood(G.party[j],-4);}}
  const f=followerMon();if(f&&SND.cfg.follow)addMood(f,2);}
setInterval(()=>{if(!G||!G.clock||mode!=='world')return;if(G._moodDay===undefined){G._moodDay=G.clock.day;return;}if(G._moodDay!==G.clock.day){G._moodDay=G.clock.day;moodNewDay();}},1500);

// ---------- emotes over your follower ----------
function followerEmote(m,now){const cyc=now%7000;if(cyc>1700)return null;const v=m.mood??60,p=persona(m);const night=dayPhase().k==='night';
  if(v<20)return 'cloud';if(v<40)return 'anger';if(night&&p==='Dreamy')return 'zzz';if(v>=85)return 'heart';if(v>=65)return p==='Playful'||p==='Fiery'?'note':'heart';
  const {f}=partyChem(m);return f>=2?'sparkle':null;}
function drawEmote(c,x,y,k){const P=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(x+a,y+b,w,h);};
  P(1,0,9,8,'#2a1f2d');P(0,1,11,6,'#2a1f2d');P(2,1,7,6,'#ffffff');P(1,2,9,4,'#ffffff');P(4,8,2,2,'#2a1f2d');P(5,8,1,1,'#ffffff');
  if(k==='heart'){P(3,2,2,1,'#e2587f');P(6,2,2,1,'#e2587f');P(3,3,5,2,'#e2587f');P(4,5,3,1,'#e2587f');P(5,6,1,1,'#e2587f');}
  else if(k==='note'){P(6,2,1,4,'#4a90d9');P(4,5,3,2,'#4a90d9');P(7,2,2,1,'#4a90d9');}
  else if(k==='anger'){P(3,2,1,2,'#e2584f');P(7,2,1,2,'#e2584f');P(3,5,1,2,'#e2584f');P(7,5,1,2,'#e2584f');P(4,3,1,1,'#e2584f');P(6,3,1,1,'#e2584f');P(4,5,1,1,'#e2584f');P(6,5,1,1,'#e2584f');}
  else if(k==='cloud'){P(3,2,5,3,'#8a96a8');P(2,3,7,2,'#8a96a8');P(3,5,1,1,'#4a90d9');P(5,6,1,1,'#4a90d9');P(7,5,1,1,'#4a90d9');}
  else if(k==='zzz'){P(3,2,3,1,'#8a6aa8');P(5,3,1,1,'#8a6aa8');P(4,4,1,1,'#8a6aa8');P(3,5,3,1,'#8a6aa8');P(7,3,2,1,'#8a6aa8');P(8,4,1,1,'#8a6aa8');P(7,5,2,1,'#8a6aa8');}
  else if(k==='sparkle'){P(5,1,1,6,'#f2b53a');P(2,4,7,1,'#f2b53a');P(4,3,3,3,'#ffe36b');}
  else if(k==='dots'){P(3,4,1,1,'#2a1f2d');P(5,4,1,1,'#2a1f2d');P(7,4,1,1,'#2a1f2d');}}
const _folEntMood=followerEnt;
followerEnt=function(camX,camY,now){const e=_folEntMood(camX,camY,now);if(!e)return e;const m=followerMon();const d0=e.draw;
  e.draw=()=>{d0();const k=followerEmote(m,now);if(!k)return;let fx=FOL.x,fy=FOL.y;if(P.moving&&!P.moving._noFol){const t=P.moving.t;fx=FOL.fx+(FOL.x-FOL.fx)*t;fy=FOL.fy+(FOL.y-FOL.fy)*t;}
    drawEmote(ctx,Math.round(fx*TS-camX)+3,Math.round(fy*TS-camY)-18,k);};return e;};

function chatterLine(m){const p=persona(m),v=m.mood??60,n=monName(m);const ph=dayPhase().k,w=typeof weatherOf==='function'?weatherOf(curMap()):'clear';
  const extra=[];if(p==='Dreamy'&&ph==='night')extra.push(`${n} loves the night. Its eyes sparkle like the stars. ✨`);if(p==='Dreamy'&&w==='rain')extra.push(`${n} listens happily to the rain. ♪`);
  if(p==='Playful'&&w==='sun')extra.push(`${n} soaks up the sunshine and zooms around!`);if(curMap().indoor)extra.push(`${n} sniffs around the room curiously.`);
  const fr=G.party.filter(o=>o!==m&&chem(m,o)>0);if(fr.length&&v>=50)extra.push(`${n} looks back at ${monName(pick(fr))} in your bag. They're good friends!`);
  const cl=G.party.filter(o=>o!==m&&chem(m,o)<0);if(cl.length)extra.push(`${n} grumbles about ${monName(pick(cl))}. Those two don't get along...`);
  const L=CHATTER[p][v>=65?'hi':v>=35?'mid':'lo'];const pool=[...L,...(extra.length&&Math.random()<.5?extra:[])];return pick(pool).replace('{n}',n);}

function homeMons(){const out=[];const free=[];const m=MAPS.home;if(!m||!G)return out;const [w,h]=homeSize('main');
  const taken=new Set(m.npcs.map(n=>n.x+','+n.y));for(let y=2;y<h-2;y++)for(let x=0;x<w;x++){if(BLOCK.has(m.rows[y][x])||taken.has(x+','+y))continue;free.push([x,y]);}
  const R=mulberry(G.clock.day*31+7);const list=G.party.slice(SND.cfg.follow?1:0);
  list.forEach((mon,i)=>{if(!free.length)return;const [x,y]=free.splice(Math.floor(R()*free.length),1)[0];
    out.push({id:'hm_'+mon.uid,x,y,dir:'down',mon:mon.sp,name:monName(mon),noRep:1,talk:async()=>{await homeBond(mon);}});});return out;}
async function homeBond(mon){const d=G.clock.day;const p=persona(mon);
  if(mon._homeDay===d){await say(`${monName(mon)} is relaxing. ${moodTier(mon.mood).e}`);return;}mon._homeDay=d;
  const fr=G.party.filter(o=>o!==mon&&chem(mon,o)>0);
  if(fr.length&&Math.random()<.45){const o=pick(fr);await say(`${monName(mon)} and ${monName(o)} play together, chasing each other around the room! ♥`);addMood(mon,8);addMood(o,6);mon.bond=Math.min(255,mon.bond+3);o.bond=Math.min(255,o.bond+2);await say(`Both look really happy. (Bond and mood up!)`);return;}
  await say(pick(BOND_SCENES[p]).replace('{n}',monName(mon)));mon.bond=Math.min(255,mon.bond+3);addMood(mon,8);
  if(Math.random()<.2){const it=pick(['berry','sweetberry','herb']);G.bag[it]=(G.bag[it]||0)+1;await say(`${monName(mon)} found a ${ITEMS[it].name} under the couch and gives it to you!`);}
  else await say(`${monName(mon)} seems happier. ${moodTier(mon.mood).e}`);}

function workInit(g){g.mats=g.mats||{};g.work=g.work||{crew:[],last:g.steps||0};}
const _migrateWork=migrate;migrate=function(g){_migrateWork(g);workInit(g);return g;};
function crew(){workInit(G);G.work.crew=G.work.crew.filter(c=>G.storage.some(m=>m.uid===c.uid));return G.work.crew.map(c=>({c,m:G.storage.find(m=>m.uid===c.uid)}));}
function workPower(m,job){const v=m.mood??60;const p=typeof persona==='function'?persona(m):'Steady';let k=(.6+v/100*.8)*(1+m.lv/60);
  k*={Steady:1.2,Playful:.9,Fiery:1,Gentle:1,Dreamy:1}[p]||1;if(job.night||p==='Dreamy')k*=dayPhase().k==='night'?1.3:.95;
  k*=1+(typeof gearFx==='function'?gearFx('work'):0)+(typeof hasSkill==='function'&&hasSkill('efficient')?.25:0);if(m.form==='iron')k*=1.35;if(G.player.cls==='Artisan')k*=1.15;return k;}
function workTick(){if(!G||!G.work)return;workInit(G);const n=Math.min(15,Math.floor((G.steps-G.work.last)/SHIFT_STEPS));if(n<=0)return;G.work.last+=n*SHIFT_STEPS;
  const cr=crew();if(!cr.length)return;const help=1+Math.min(.4,cr.reduce((a,{c})=>a+(JOBS[c.type].help||0),0));const got={};
  for(let s=0;s<n;s++)for(const {c,m} of cr){const job=JOBS[c.type];c.acc=(c.acc||0)+workPower(m,job)*help*.5;
    while(c.acc>=1){c.acc-=1;const k=Math.random()<job.side[1]?job.side[0]:job.main;G.mats[k]=(G.mats[k]||0)+1;got[k]=(got[k]||0)+1;}
    m.shifts=(m.shifts||0)+1;const p=typeof persona==='function'?persona(m):'Steady';if(s%2===0&&typeof addMood==='function')addMood(m,p==='Steady'?0:p==='Playful'||p==='Fiery'?-2:-1);}
  const txt=Object.entries(got).map(([k,q])=>`${MATS[k].i}${q}`).join(' ');if(txt)toast(`⚒️ Your crew gathered ${txt}`);}

const ingName=k=>MATS[k]?`${MATS[k].i} ${MATS[k].n}`:ITEMS[k]?ITEMS[k].name:k;
const ingHave=k=>MATS[k]?(G.mats[k]||0):(G.bag[k]||0);
function canCraft(r){return Object.entries(r.in).every(([k,q])=>ingHave(k)>=q);}
async function doCraft(r){if(!canCraft(r))return false;let [kind,key,q]=r.out;
  if(kind==='gem'){const types=GEM_TYPES;const c=await UI.choose('Which type of gem?',[...types,'Cancel']);if(c<0||c>=types.length)return false;key='gem_'+types[c];kind='item';}
  if(kind==='gear'&&G.gear.owned.includes(key)){await UI.alert('You already have that.');return false;}
  for(const [k,n] of Object.entries(r.in)){if(MATS[k])G.mats[k]-=n;else G.bag[k]-=n;}
  const bonus=((typeof gearFx==='function'&&gearFx('craft'))||hasSkill('bigcrew'))&&Math.random()<(hasSkill('bigcrew')?.3:.25)?1:0;
  if(kind==='item')G.bag[key]=(G.bag[key]||0)+q+bonus;else if(kind==='gear')giveGear(key);else if(kind==='furn'){G.home.inv[key]=(G.home.inv[key]||0)+q+bonus;}
  SND.sfx('item');if(typeof gainTamerXp==='function')gainTamerXp(4);toast(`🔨 Crafted ${r.n}${bonus?' (+1 bonus!)':''}${kind==='furn'?' — it\'s in your furniture box':''}`);return true;}

    for(const [fk,f] of Object.entries(FORMS)){const id=to+'_'+fk[0];const t0=F.types[0];const t2=t0===f.type?f.alt:f.type;
      const st=STAT_KEYS.map((k,i)=>{let d=f.stat[k];if(fk==='feral'&&(k==='atk'||k==='mag')){const phys=F.base[1]>=F.base[3];d=(k==='atk')===phys?20:5;}return Math.max(20,F.base[i]+d);});
      const sp=JSON.parse(JSON.stringify(F.spr));sp.c=f.col(F.spr.c);const x=new Set(sp.x||[]);for(const r of f.rm)x.delete(r);for(const a of f.add)x.add(a);
      const topper=['cap','sprout','crown','flamecrest','crest','lily'].some(k=>x.has(k));
      if(fk==='blossom'){if(!topper)x.add('lily');if(!sp.w&&sp.b!=='bird')sp.w=1;}

      BRANCH_OF[to][fk]=id;order.splice(insertAt++,0,id);}}

// Four 7-day seasons. Each changes which rascals show up, how the world looks, and brings a festival on day 4 in Mossbrook.
const SEASONS=[
  {k:'spring',n:'Spring',i:'🌸',types:['Leaf','Glimmer','Gust'],part:'petals',tint:[0,0,0,0]},
  {k:'summer',n:'Summer',i:'☀️',types:['Ember','Tide','Spark'],part:null,night:'fireflies',tint:[0,0,.7,0]},
  {k:'autumn',n:'Autumn',i:'🍂',types:['Stone','Shade','Plain'],part:'leaves',tint:[.85,0,0,0]},
  {k:'winter',n:'Winter',i:'❄️',types:['Frost','Glimmer','Tide'],part:'snow',tint:[0,.78,0,0]}];
const FEST_DAY=4;
function seasonIdx(d){return Math.floor((((d||(G&&G.clock?G.clock.day:1))-1)/7))%4;}
function season(d){return SEASONS[seasonIdx(d)];}
function seasonDay(d){return (((d||G.clock.day)-1)%7)+1;}
function festToday(){return !!(G&&G.clock&&seasonDay()===FEST_DAY);}
function daysToFest(){const sd=seasonDay();return sd<=FEST_DAY?FEST_DAY-sd:7-sd+FEST_DAY;}
const NO_SEASON=new Set(['cinder','crater','ashpath','emberfall','den']);
function seasonal(m){return m&&!m.indoor&&m.home===undefined&&!m.snowy&&m.bg!=='cave'&&!NO_SEASON.has(m.id);}
seasonTint=function(m){return G&&SND.cfg.seasons!==false&&seasonal(m)?season().tint:[0,0,0,0];};
if(SND.cfg.seasons===undefined)SND.cfg.seasons=true;

const _partS=particles;particles=function(m,now,dt){const k=seasonPart(m);if(!k)return _partS(m,now,dt);const sv=PFX[m.id],sn=m.snowy;

async function runContest(){const s=season(),C=CONTESTS[s.k],tier=festTier(),T=FEST_TIERS[tier];G.fest=G.fest||{};
  if(G.fest.day===G.clock.day){await say(`Host Marigold: You've already competed today! Come back next festival — the ${CONTESTS[SEASONS[(seasonIdx()+1)%4].k].n} is next ${SEASONS[(seasonIdx()+1)%4].n}.`);return;}

  const aw=app.clientWidth,ah=app.clientHeight;const tablet=coarse&&Math.min(aw,ah)>=600;const land=coarse&&aw>ah*1.1;

  if(land){vh=Math.max(9,Math.min(13,Math.round(ah/(tablet?62:38))));vw=Math.max(15,Math.min(25,Math.round(vh*aw/ah)));sw=Math.min(aw,ah*vw/vh);}
  else if(coarse){const ctrl=tablet?250:Math.max(170,Math.min(210,ah*.24));const avail=ah-ctrl;vw=Math.max(11,Math.min(17,Math.round(aw/(tablet?58:36))));
    vh=Math.max(9,Math.min(23,Math.floor(avail/(aw/vw))));sw=Math.min(aw,avail*vw/vh);}

  sparkmunk: {front:'assets/rascals/sparkmunk.png', side:'assets/rascals/sparkmunk_side.png', back:'assets/rascals/sparkmunk_back.png'},
  thundermunk: {front:'assets/rascals/thundermunk.png', side:'assets/rascals/thundermunk_side.png', back:'assets/rascals/thundermunk_back.png'},
  breezle: {front:'assets/rascals/breezle.png', side:'assets/rascals/breezle_side.png', back:'assets/rascals/breezle_back.png'},
  galefinch: {front:'assets/rascals/galefinch.png', side:'assets/rascals/galefinch_side.png', back:'assets/rascals/galefinch_back.png'},
  tempestork: {front:'assets/rascals/tempestork.png', side:'assets/rascals/tempestork_side.png', back:'assets/rascals/tempestork_back.png'},
  mushling: {front:'assets/rascals/mushling.png', side:'assets/rascals/mushling_side.png', back:'assets/rascals/mushling_back.png'},
  toadstoll: {front:'assets/rascals/toadstoll.png', side:'assets/rascals/toadstoll_side.png', back:'assets/rascals/toadstoll_back.png'},
  frostbun: {front:'assets/rascals/frostbun.png', side:'assets/rascals/frostbun_side.png', back:'assets/rascals/frostbun_back.png'},
  glacihare: {front:'assets/rascals/glacihare.png', side:'assets/rascals/glacihare_side.png', back:'assets/rascals/glacihare_back.png'}
});
const _rascalOriginalMonsterSprite = monsterSprite;
const _rascalOriginalSpriteURL = spriteURL;
const _rascalStarterImages = Object.create(null);
const _rascalStarterCanvases = Object.create(null);
function rascalCustomView(id, hue, opts) {
  const artwork=RASCAL_STARTER_PNG[id];
  if (!artwork || (hue || 0) || (opts && opts.sil)) return null;
  const view=(opts && opts.back)?'back':(opts && opts.side)?'side':'front';
  return artwork[view]?view:null;
}
function rascalStarterImage(id,view) {
  const key=id+'|'+view;
  if (_rascalStarterImages[key]) return _rascalStarterImages[key];
  const img=new Image();
  img.decoding='async';
  img.onload=()=>{
    // A procedural fallback may have been cached before this image loaded.
    // Discard that particular view while leaving other views intact.
    const suffix=view==='back'?'|0|0|1':view==='side'?'|0|0|0|s':'|0|0|0';
    delete spriteCache[id+suffix];
    delete spriteCache['u|'+id+'|0|0|'+(view==='back'?1:0)];
    delete _rascalStarterCanvases[key];
  };
  img.onerror=()=>console.warn('Could not load starter sprite:',id,view);
  img.src=RASCAL_STARTER_PNG[id][view];
  _rascalStarterImages[key]=img;
  return img;
}
monsterSprite=function(speciesId,hue,opts) {
  const view=rascalCustomView(speciesId,hue,opts);
  if (view) {
    const image=rascalStarterImage(speciesId,view);
    if (image.complete && image.naturalWidth) {
      const key=speciesId+'|'+view;
      if (!_rascalStarterCanvases[key]) {
        const canvas=document.createElement('canvas');
        canvas.width=canvas.height=48; // game and texture atlases expect 48×48
        const ctx=canvas.getContext('2d');
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(image,0,0,48,48);
        _rascalStarterCanvases[key]=canvas;
      }
      return _rascalStarterCanvases[key];
    }
  }
  return _rascalOriginalMonsterSprite(speciesId,hue,opts);
};
spriteURL=function(speciesId,hue,opts) {
  const view=rascalCustomView(speciesId,hue,opts);
  if (view) return RASCAL_STARTER_PNG[speciesId][view];
  return _rascalOriginalSpriteURL(speciesId,hue,opts);
};
// Preload all three orientations. Rightward followers are mirrored by
// the game's existing follower renderer; the side PNG faces left.
for(const id of Object.keys(RASCAL_STARTER_PNG))
  for(const view of Object.keys(RASCAL_STARTER_PNG[id])) rascalStarterImage(id,view);
// ===== End illustrated starter art =====
</script>

document.getElementById('dialog').addEventListener('click',()=>{if(Dialog.active&&!Dialog.choices)Dialog.press('a');else if(Dialog.typing)Dialog.finishType();});
bindTouch();UI.title();
</script>
